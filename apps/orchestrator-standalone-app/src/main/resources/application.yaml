server:
  port: ${SERVER_PORT:8105}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:orchestrator}
  # Distributed tracing (OpenTelemetry over OTLP). Disabled by default (sampling 0.0) so there is
  # no overhead until you opt in: set TRACING_SAMPLING=1.0 (or any value in (0,1]) and point
  # OTLP_TRACING_ENDPOINT at your collector (Tempo/Jaeger/OTel Collector, default the OTLP HTTP port).
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

eventconductor:
  security:
    enabled: ${SECURITY_ENABLED:true}
    user: ${SECURITY_USER:admin}
    # If left blank, Spring Boot generates a one-shot password at startup
    # and logs it. Set EC_SECURITY_PASSWORD explicitly in production.
    password: ${SECURITY_PASSWORD:}

app:
  features:
    data-source: mem

spring:
  ai:
    mcp:
      server:
        name: event-conductor
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # SSE connections must not expire

  cloud:
    function:
      definition: consumeOutbox;consumeUpstream;consumeWorkerEvent
    stream:
      # Retry failed bindings every 10s so consumers bind as soon as a broker that was down at
      # startup becomes available (instead of never rebinding).
      bindingRetryInterval: 10
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
          # Horizontal parallelism is capped by partition count: a process is pinned to one
          # partition (keyed by processId), so N partitions is the most pods that can share the
          # engine's load. Auto-created topics otherwise default to a single partition — one
          # consumer, no scale-out however many pods run. Provision several partitions so pods can
          # spread the per-process load. Set >= the largest consumer group you expect to run.
          min-partition-count: ${KAFKA_MIN_PARTITIONS:6}
          # Bound the broker-provisioning admin timeout (default 120s) so a broker that is not
          # yet reachable at startup fails fast instead of blocking the context ~2 minutes and
          # losing its AdminClient; bindings then retry (see bindingRetryInterval) and bind once
          # the broker is up. Kafka requires default.api.timeout.ms >= request.timeout.ms.
          configuration:
            default.api.timeout.ms: 15000
            request.timeout.ms: 10000
        # Note: producer sends are synchronous
        # (spring.cloud.stream.kafka.default.producer.sync=true). That default is contributed by
        # the engine itself, in SynchronousProducerDefaults, because it is what makes the
        # transactional outbox transactional — asynchronously, a send to a broker that is down
        # still reports success and the relay marks the row Sent. It is settable here, but
        # turning it off trades correctness for a round-trip.
      bindings:
        consumeOutbox-in-0:
          destination: outbox
          # A consumer group per binding, not one shared between them. A group whose members
          # subscribe to different topics is assigned by the default range assignor per topic,
          # and with mixed subscriptions it leaves partitions with no consumer at all: those
          # messages are never read and the processes waiting on them never move. Observed on a
          # cluster — 12 members, 7 of 12 partitions assigned, throughput at a quarter of what
          # the same pods managed once the groups were split.
          group: orchestrator-outbox
          consumer:
            # A poll batch is committed as one transaction per process instead of one per event:
            # a busy batch carries several events for the same process, and collapsing those into
            # a single commit is most of the write cost. Turning this off falls back to one
            # transaction per event.
            batch-mode: true
            # Consumer threads on this pod: each owns a disjoint set of partitions, so one pod can
            # work several partitions in parallel. Keep <= partitions assigned to this pod; total
            # concurrency across pods is still capped by min-partition-count above.
            #
            # Three rather than one, because one means a deployment can never use more partitions
            # than it has replicas — the rest sit unassigned and the work keyed to them waits.
            # Measured on a three-pod cluster against the six partitions above: four consumed,
            # two unread, and no pod anywhere near CPU-bound. Both bindings run this many threads
            # and each holds a connection while it works, so DB_POOL_SIZE has to stay above their
            # sum plus the relay, the scanner and the UI.
            concurrency: ${KAFKA_CONCURRENCY:3}
        consumeUpstream-in-0:
          destination: upstream
          group: orchestrator-upstream
          consumer:
            batch-mode: true
            concurrency: ${KAFKA_CONCURRENCY:3}
        consumeWorkerEvent-in-0:
          destination: downstream
          group: worker-group
        upstream:
          destination: upstream
        downstream:
          destination: downstream
        outbox:
          destination: outbox
        # Where events the engine can never process are parked, unchanged, so they can be
        # inspected and replayed onto the destination named in their x-dead-letter-source header.
        deadLetter:
          destination: dead-letter

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/workflow}
    username: ${DB_USERNAME:user_app}
    password: ${DB_PASSWORD:user_password}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}

  hikari:
    connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
    # A process update holds a connection for its critical section, so the pool caps how many
    # in-flight processes this pod can advance at once. It has to cover every thread that holds one
    # at once: KAFKA_CONCURRENCY on each of the two consumer bindings, plus the outbox relay, the
    # timeout scanner and any HTTP request in the UI. Size it to expected concurrency (and to the
    # database's max_connections across all pods); raise DB_POOL_SIZE to scale.
    maximum-pool-size: ${DB_POOL_SIZE:16}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      # In production set DDL_AUTO=validate so Hibernate validates against the
      # Flyway-managed schema without altering it. The default remains "update"
      # for backwards compatibility with existing deployments.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Batch the per-step write burst (step + process + N outbox rows) into few JDBC round-trips
        # instead of one statement each. order_inserts/updates group same-table statements so the
        # batches are effective; the repositories already saveAll the outbox rows.
        jdbc:
          batch_size: ${HIBERNATE_BATCH_SIZE:20}
        order_inserts: true
        order_updates: true

  flyway:
    # On by default: the migrations are the schema of record, and they are the only place the
    # engine's indexes come from. Running without them — which used to be the default — leaves a
    # schema with primary keys and nothing else, because Hibernate's ddl-auto=update path emits no
    # index DDL. Every deadline scan, outbox claim and message correlation then becomes a
    # sequential scan; measured on a cluster, that pinned PostgreSQL at 750m of CPU and cut
    # throughput to a fraction.
    #
    # Safe to enable on a schema that ddl-auto already created: it baselines at V1 and every later
    # migration is written with IF NOT EXISTS.
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/workflow
    baseline-on-migrate: true
    baseline-version: 1
    out-of-order: false
    validate-on-migrate: true


workflow:
  mode: ${WORKFLOW_MODE:kafka}
  persistence: ${WORKFLOW_PERSISTENCE:jpa}
  # Fallback timeout for ACTION and RULE steps that declare none. Off by default because the
  # right value depends on the slowest task your workers legitimately perform, and too low a
  # value turns healthy slow work into retries.
  #
  # Off is not free either. A step with no deadline is invisible to the timeout scan by
  # construction, so if its dispatch or its worker's reply is lost the process stops there
  # permanently and nothing reports it. Measured during a broker outage: 3 356 processes ended
  # that way. Set this to comfortably more than your slowest task and the engine recovers them
  # itself; leave it off and watch eventconductor.steps.stalled instead.
  default-step-timeout-ms: ${DEFAULT_STEP_TIMEOUT_MS:0}
  # How long a live step with no deadline may sit before it is counted as stalled.
  stalled-step-after-ms: ${STALLED_STEP_AFTER_MS:900000}
  git-import:
    repositories:
      # Example: uncomment and fill in to import workflow definitions from a Git repo at startup
      # - url: https://github.com/your-org/your-workflows-repo.git
      #   branch: main
      #   username: your-username        # optional, for private repos
      #   password: your-token-or-pass  # optional, for private repos

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
