# src/test/resources/application-test.properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Hibernate creates tables from @Entity classes.
spring.jpa.hibernate.ddl-auto=create-drop
# Security is disabled in tests so context-load and contract tests don't need
# to authenticate. Production defaults keep it enabled.
eventconductor.security.enabled=false
