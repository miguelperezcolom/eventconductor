server:
  port: 8991

app:
  features:
    data-source: mem

# This dev app runs distributed (Kafka + JPA). The framework default is
# embedded + memory, so opt into kafka/jpa explicitly here.
workflow:
  mode: ${WORKFLOW_MODE:kafka}
  persistence: ${WORKFLOW_PERSISTENCE:jpa}

rules:
  persistence: ${RULES_PERSISTENCE:jpa}
  source: local
  grpc:
    enabled: ${RULES_GRPC_ENABLED:true}
    port: ${RULES_GRPC_PORT:9090}

spring:
  ai:
    mcp:
      server:
        name: eventconductor-engine
        version: 1.0.0

  # --- Configuración de Spring Cloud Stream ---
  cloud:
    function:
      definition: processDomainEvent
    stream:
      bindingRetryInterval: 10
      kafka:
        binder:
          # Centralizamos la conexión aquí para el Binder
          brokers: localhost:9092
          auto-create-topics: true
          # Fail fast if the broker is not reachable at startup (default admin timeout is 120s)
          # so the context does not block ~2 minutes; bindings then retry (bindingRetryInterval).
          configuration:
            default.api.timeout.ms: 15000
            request.timeout.ms: 10000
      bindings:
        # Asegúrate de que este nombre coincide con el que usas en streamBridge.send("entityOutput-out-0", ...)
        entityOutput-out-0:
          destination: my-topic-name
          content-type: application/json
        domain-out-0:
          destination: domain
          content-type: application/json
        worker-out-0:
          destination: downstream
          content-type: application/json
        processDomainEvent-in-0:
          destination: domain
          group: dev-app-group
        rules:
          destination: rules

  # --- Configuración de Base de Datos (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/workflow
    username: user_app
    password: user_password
    driver-class-name: org.postgresql.Driver

  hikari:
    connection-timeout: 20000
    maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # --- Configuración de Kafka Nativo ---
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # IMPORTANTE: Cambiado a ByteArraySerializer para evitar el ClassCastException [B cannot be cast to String
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer


logging:
  level:
    org.hibernate.SQL: ERROR
    org.hibernate.orm.jdbc.bind: ERROR
    org.springframework.kafka: ERROR
    # He añadido este para que veas errores detallados del binder si algo falla
    org.springframework.cloud.stream: ERROR
