<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventConductor Agent</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            overflow: hidden;
        }

        #chat-header {
            padding: 16px 20px;
            background: #1a1a2e;
            color: white;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #chat-header .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #1a1a2e;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent {
            align-self: flex-start;
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }

        .message.agent.streaming {
            opacity: 0.85;
        }

        #input-area {
            display: flex;
            padding: 16px;
            gap: 10px;
            border-top: 1px solid #e2e8f0;
            background: white;
        }

        #input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            resize: none;
            height: 42px;
            line-height: 1.4;
        }

        #input:focus { border-color: #1a1a2e; }

        #send-btn {
            padding: 10px 20px;
            background: #1a1a2e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
        }

        #send-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #send-btn:hover:not(:disabled) { background: #16213e; }
    </style>
</head>
<body>
<div id="chat-container">
    <div id="chat-header">
        <div class="dot"></div>
        EventConductor Agent
    </div>
    <div id="messages">
        <div class="message agent">Hola, soy el agente de EventConductor. Puedo consultar el estado de los procesos, ver logs y reintentar pasos fallidos. ¿En qué te puedo ayudar?</div>
    </div>
    <div id="input-area">
        <textarea id="input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
        <button id="send-btn">Enviar</button>
    </div>
</div>

<script>
    const AGENT_URL = 'http://localhost:8095/api/agent/chat';

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send-btn');

    function scrollBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        scrollBottom();
        return div;
    }

    async function send() {
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = '';
        sendBtn.disabled = true;
        addMessage(text, 'user');

        const agentMsg = addMessage('...', 'agent streaming');

        try {
            const response = await fetch(`${AGENT_URL}?message=${encodeURIComponent(text)}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const reply = await response.text();
            agentMsg.textContent = reply;
            agentMsg.classList.remove('streaming');
        } catch (e) {
            agentMsg.textContent = 'Error al conectar con el agente: ' + e.message;
            agentMsg.classList.remove('streaming');
        }

        sendBtn.disabled = false;
        inputEl.focus();
    }

    sendBtn.addEventListener('click', send);

    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            send();
        }
    });
</script>
</body>
</html>
