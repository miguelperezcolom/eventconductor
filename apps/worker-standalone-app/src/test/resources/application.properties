# src/test/resources/application-test.properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Hibernate creates tables from @Entity classes.
spring.jpa.hibernate.ddl-auto=create-drop
# The workflow-engine starter's beans (DbLockDialect, schedulers, ...)
# are wired by workflow.mode/workflow.persistence; without them the context
# fails to load with a NoSuchBeanDefinitionException for DbLockDialect.
workflow.mode=kafka
workflow.persistence=jpa
