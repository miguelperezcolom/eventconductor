# The application's own application.yaml, with the two things a build machine cannot provide
# swapped out: an in-memory database instead of PostgreSQL, and the in-memory stream binder
# instead of a broker. Everything else — the simulator, its stores, the Mateu pages — starts
# exactly as it does in production, which is the only reason this test is worth running.
#
# It used to declare H2 *and* workflow.persistence=jpa, a property this application does not have
# and never read, while the app it was meant to be testing ran with no database at all. The
# context it proved could start was not this application's.
spring.datasource.url=jdbc:h2:mem:workertestdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
