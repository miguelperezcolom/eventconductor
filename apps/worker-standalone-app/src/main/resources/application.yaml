server:
  port: 8091

# Stateless worker: no engine, no datasource. Exclude JDBC/JPA autoconfig (data-jpa is on the
# classpath transitively) so nothing tries to open a DB connection.
# Kafka mode (external worker); memory persistence activates the Spring Cloud Stream wiring
# (StreamBridge) without needing a database.
workflow:
  mode: ${WORKFLOW_MODE:kafka}
  persistence: ${WORKFLOW_PERSISTENCE:memory}

spring:
  application:
    name: worker
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  cloud:
    function:
      definition: consumeWorkerEvent
    stream:
      bindingRetryInterval: 10
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
          configuration:
            default.api.timeout.ms: 15000
            request.timeout.ms: 10000
      bindings:
        # Consume TaskExecutionRequested published by the engine on `downstream`.
        consumeWorkerEvent-in-0:
          destination: downstream
          group: worker-app-group
          consumer:
            start-offset: earliest
        # StreamBridge target the worker uses to report TaskStatusChanged.
        upstream:
          destination: upstream

logging:
  level:
    org.springframework.kafka: warn
    org.springframework.cloud.stream: warn
