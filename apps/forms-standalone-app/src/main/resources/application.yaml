server:
  port: ${SERVER_PORT:8106}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name:forms-engine}
  # Distributed tracing (OpenTelemetry over OTLP). Off by default; set TRACING_SAMPLING=1.0 and
  # OTLP_TRACING_ENDPOINT to your collector to enable.
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:0.0}
  # The OTLP endpoint the spans are shipped to. Under this name and no other: Boot 4 deprecated
  # `management.otlp.tracing.endpoint` at level ERROR, which means it is no longer bound — the
  # metadata entry survives only to say so. Set under the old name it read back fine, no exporter
  # was ever created, and every span was built and dropped. OTLP_TRACING_ENDPOINT is unchanged, so
  # nothing deployed has to move.
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    # Metrics over OTLP: off by default, so a deployment that scrapes Prometheus is unaffected.
    # Turn it on when you already run a collector and want one pipeline for both signals.
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
        url: ${OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
        step: ${OTLP_METRICS_INTERVAL:60s}


eventconductor:
  security:
    enabled: ${SECURITY_ENABLED:true}
    user: ${SECURITY_USER:admin}
    password: ${SECURITY_PASSWORD:}

app:
  features:
    data-source: mem

# This standalone app runs distributed (Kafka + JPA). The framework default is
# embedded + memory, so opt into kafka/jpa explicitly here.
workflow:
  mode: ${WORKFLOW_MODE:kafka}
  persistence: ${WORKFLOW_PERSISTENCE:jpa}

spring:
  ai:
    mcp:
      server:
        name: forms-engine
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # SSE connections must not expire

  cloud:
    function:
      definition: consumeWorkerEventForFormsEngine
    stream:
      bindingRetryInterval: 10
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}
          auto-create-topics: true
          # Fail fast if the broker is not reachable at startup (default admin timeout is 120s)
          # so the context does not block ~2 minutes; bindings then retry (bindingRetryInterval).
          configuration:
            default.api.timeout.ms: 15000
            request.timeout.ms: 10000
      bindings:
        consumeOutbox-in-0:
          destination: outbox
          group: forms-engine-group
        consumeWorkerEventForFormsEngine-in-0:
          destination: downstream
          group: forms-engine-group
        upstream:
          destination: upstream
        downstream:
          destination: downstream
        outbox:
          destination: outbox

  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5432/workflow}
    username: ${DB_USERNAME:user_app}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT:20000}
      maximum-pool-size: ${DB_POOL_SIZE:16}

  jpa:
    database-platform: ${JPA_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
    hibernate:
      # In production set DDL_AUTO=validate so Hibernate validates against the
      # Flyway-managed schema without altering it. The default remains "update"
      # for backwards compatibility with existing deployments.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    # Off: the forms engine now ships and applies its own migrations (see forms.schema below). This
    # is Boot's Flyway, for *this application's* own migrations, and it has none.
    enabled: false

forms:
  # The forms engine reads its own `forms.persistence`, not `workflow.persistence` above; without
  # this the engine falls back to its in-memory repositories and every form definition and task
  # execution dies with the pod — while this app is wired to PostgreSQL, ships forms migrations and
  # runs under DDL_AUTO=validate. Same opt-in as `rules.persistence` in rule-standalone-app.
  persistence: ${FORMS_PERSISTENCE:jpa}
  schema:
    # The engine applies its own migrations at startup. They are the only place this app's indexes
    # come from — Hibernate's ddl-auto=update path emits no index DDL — and under the chart's
    # DDL_AUTO=validate they are the only thing that creates the tables at all. Safe on a schema
    # ddl-auto already created: every V1 is written with IF NOT EXISTS.
    enabled: ${FLYWAY_ENABLED:true}
    # Its own history table, because forms, rules and the orchestrator are routinely pointed at one
    # database — that is what the chart does — and each carries a different set of migrations under
    # the same version numbers. Kept at the name existing deployments already have, rather than the
    # engine's own default, so their history is not suddenly empty.
    table: ${FLYWAY_TABLE:flyway_schema_history_forms}
  # Directories on disk to import form definitions from at startup. Comma-separated; empty means
  # none. Unlike the git import below, this reads the files as they are — no commit in between.
  directory-import:
    directories: ${FORMS_DEFINITIONS_DIRS:}
  git-import:
    repositories:
      # Example: uncomment and fill in to import form definitions from a Git repo at startup
      # - url: https://github.com/your-org/your-forms-repo.git
      #   branch: main
      #   username: your-username        # optional, for private repos
      #   password: your-token-or-pass  # optional, for private repos

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
