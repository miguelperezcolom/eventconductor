# The context test runs without a broker and without Postgres: H2 stands in for the read database so
# the schema, the store and the consumer bean are all really built, and the binder is left to fail to
# connect in the background (bindings retry; the context still refreshes).
spring.datasource.url=jdbc:h2:mem:projector;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
