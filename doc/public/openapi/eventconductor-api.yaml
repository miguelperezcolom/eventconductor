openapi: 3.1.0
info:
  description: "The engine's REST API under /workflow/api: processes, messages, events\
    \ and triggers, schedules and synchronous invocations. Every operation takes the\
    \ X-Api-Key header when workflow.message-api.api-key is set; with Spring Security\
    \ the application's own authentication applies instead."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: EventConductor engine API
  version: v1
servers:
- url: /
security:
- apiKey: []
tags:
- description: Opt-in test runs and frozen process graphs.
  name: Workflow execution
- description: "Workers over HTTP: long-poll for tasks and answer them, in any language."
  name: Workers
- description: Validated writes to running processes that answer with a result.
  name: Updates
- description: "Failures waiting for an operator, grouped by definition, step and\
    \ error family."
  name: Incidents
- description: "Start, read, list and operate processes."
  name: Processes
- description: "Cancel, retry, restart, pause or resume every process a filter matches."
  name: Batch operations
paths:
  /workflow/api/batch-operations:
    get:
      description: The most recent first.
      operationId: listBatchOperations
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BatchOperationView"
          description: OK
      summary: List batch operations
      tags:
      - Batch operations
    post:
      description: "Applies the command to every process the filter matches, in the\
        \ background, a page at a time."
      operationId: createBatchOperation
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchOperationRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationView"
          description: Accepted; Location names the batch.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No type, an unknown one, an empty filter or a malformed one."
      summary: Create a batch operation
      tags:
      - Batch operations
  /workflow/api/batch-operations/{id}:
    get:
      operationId: getBatchOperation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationView"
          description: The batch and its progress.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such batch.
      summary: Get a batch operation
      tags:
      - Batch operations
  /workflow/api/batch-operations/{id}/cancel:
    post:
      description: No further process is touched; what was done stays done.
      operationId: cancelBatchOperation
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchOperationView"
          description: Cancelled.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such batch.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: It already finished.
      summary: Cancel a batch operation
      tags:
      - Batch operations
  /workflow/api/definitions/{definitionId}/invocations:
    get:
      operationId: getByKey
      parameters:
      - in: path
        name: definitionId
        required: true
        schema:
          type: string
      - in: query
        name: idempotencyKey
        required: true
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
          description: OK
      tags:
      - sync-invocation-controller
    post:
      operationId: invoke
      parameters:
      - in: path
        name: definitionId
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      - in: query
        name: follow
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - sync-invocation-controller
  /workflow/api/definitions/{definitionId}/update-with-start:
    post:
      description: "With no process for the key, starts one whose first act is the\
        \ update: evaluated against the initial variables, its `set` seeds them, and\
        \ the process and its completed update are created together. With one, delivers\
        \ the update to it (as `updateProcess`). A refused update starts nothing.\
        \ `started` says which happened."
      operationId: updateWithStart
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: path
        name: definitionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWithStartRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Applied; `started` says whether this call started the process.
        "202":
          content:
            application/json:
              schema:
                type: object
          description: The deadline passed first; read the update at Location.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No business key, or an invalid payload."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such definition or update.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The key belongs to another definition's process, or the process\
            \ is not accepting."
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A guard refused it.
      summary: "Update the process with a business key, starting it if there is none"
      tags:
      - Updates
  /workflow/api/events/received:
    get:
      operationId: received
      parameters:
      - in: query
        name: workflowId
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventReceipt"
          description: OK
      tags:
      - event-rest-controller
  /workflow/api/events/{destination}:
    post:
      operationId: publish
      parameters:
      - in: path
        name: destination
        required: true
        schema:
          type: string
      - in: query
        name: key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: OK
      tags:
      - event-rest-controller
  /workflow/api/incidents:
    get:
      description: "The failed steps of failed (ERROR) processes, grouped by definition,\
        \ step and error family, most failures first."
      operationId: listIncidents
      parameters:
      - description: Only this definition's.
        in: query
        name: definitionId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
          description: The incidents.
      summary: List incidents
      tags:
      - Incidents
  /workflow/api/incidents/{key}/processes:
    get:
      description: Most recent first — the drill-down to its processes.
      operationId: listIncidentProcesses
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      - description: "At most this many, 1–500."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentMember"
          description: Its failed steps.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such incident (any more).
      summary: The failed steps of one incident
      tags:
      - Incidents
  /workflow/api/incidents/{key}/retry:
    post:
      description: "As a RETRY batch operation over the incident, in the background:\
        \ each member's failed steps retried on the node that owns its process, under\
        \ its lock, recorded in the process's log with the caller and the reason.\
        \ Location names the batch."
      operationId: retryIncident
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationReason"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentRetryAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No reason.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the definition.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such incident (any more).
      summary: Retry every failed step of one incident
      tags:
      - Incidents
  /workflow/api/invocations/{invocationId}:
    get:
      operationId: get_1
      parameters:
      - in: path
        name: invocationId
        required: true
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      - in: query
        name: follow
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - sync-invocation-controller
  /workflow/api/messages:
    post:
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      tags:
      - message-rest-controller
  /workflow/api/processes:
    get:
      description: "One page of processes, newest first, narrowed by every filter\
        \ given (ANDed). Search attributes (the ones definitions declare in searchAttributes):\
        \ attr.<name>=value — exact for a keyword or bool, contains for a text, equal\
        \ for a number or date — and attr.<name>.gt=, .gte=, .lt=, .lte= for a number\
        \ or a date; repeatable, with query= for the same conditions as text. Served\
        \ from the process index (workflow.projection.enabled) when only q and search\
        \ attributes are given, from the engine's store otherwise — the same rule\
        \ as the admin console's listing."
      operationId: listProcesses
      parameters:
      - description: Only processes of this definition.
        in: query
        name: definitionId
        required: false
        schema:
          type: string
      - description: Only processes of the definitions carrying this tag (case-insensitive).
        in: query
        name: tag
        required: false
        schema:
          type: string
      - description: Only processes in any of these statuses; repeat it or separate
          with commas.
        in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Created at or after: an ISO date-time, or a date (its first\
          \ moment)."
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: "Created at or before: an ISO date-time, or a date (its last\
          \ moment)."
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: Business key contains this (case-insensitive).
        in: query
        name: businessKey
        required: false
        schema:
          type: string
      - description: Name or business key contains this (case-insensitive).
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: "Search-attribute conditions joined by AND: customerId = \"C-9\"\
          \ AND amount > 100 (operators =, >, >=, <, <=). ANDed with every attr.<name>\
          \ parameter."
        in: query
        name: query
        required: false
        schema:
          type: string
      - description: Zero-based page.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Page size, 1–500."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPage"
          description: One page of processes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A malformed filter or page.
      summary: List processes
      tags:
      - Processes
    post:
      description: "Starts a process of the definition. Idempotent on the business\
        \ key: the same key and definition again returns the existing process with\
        \ 200."
      operationId: startProcess
      parameters:
      - description: "W3C trace context: the process joins the caller's trace."
        in: header
        name: traceparent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProcessRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: "A process of this definition already has the business key\
            \ (and the definition's businessKeyPolicy keeps it), or its startPolicy's\
            \ singleton skipped the start while this, the running one, goes on (EventConductor-Flow-Control:\
            \ skipped)."
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: Started; Location names the new process.
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartHeldBack"
          description: "The definition's startPolicy held the start back: debounced\
            \ or throttled (queued). No process yet."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No definitionId, or over the engine's input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not start the definition.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such definition.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The key is taken by another definition's process, or the definition\
            \ accepts no new processes."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The definition's startPolicy throttle dropped the start; Retry-After
            says when a window has room.
      summary: Start a process
      tags:
      - Processes
  /workflow/api/processes/by-key:
    get:
      description: Exact match.
      operationId: getProcessByBusinessKey
      parameters:
      - in: query
        name: businessKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: The process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No process has the key.
      summary: Find a process by its business key
      tags:
      - Processes
  /workflow/api/processes/by-key/updates/{name}:
    post:
      description: "As `updateProcess`, finding the process by its business key."
      operationId: updateProcessByBusinessKey
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: query
        name: businessKey
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The update's payload (any JSON).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Applied; `result` is the reply.
        "202":
          content:
            application/json:
              schema:
                type: object
          description: The deadline passed first; read the update at Location.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No process has the key, or no such update."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process is not accepting the update now.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A guard refused it.
      summary: Apply an update to the running process with a business key
      tags:
      - Updates
  /workflow/api/processes/{id}:
    get:
      operationId: getProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: The process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: Get a process
      tags:
      - Processes
  /workflow/api/processes/{id}/cancel:
    post:
      description: Its live steps are cancelled and the workers told. Not for a COMPLETED
        process.
      operationId: cancelProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Cancel a process
      tags:
      - Processes
  /workflow/api/processes/{id}/children:
    get:
      description: "Includes earlier attempts, iterations and continuations. Paged\
        \ oldest first; no recursive traversal. A page holding a child the caller\
        \ may not read is refused whole with 403, so that totalElements never counts\
        \ runs the caller cannot see."
      operationId: getProcessChildren
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      - in: query
        name: stepId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChildrenPage"
          description: OK
      summary: "Direct child runs, linked to their parent step execution"
      tags:
      - Workflow execution
  /workflow/api/processes/{id}/graph:
    get:
      operationId: getProcessGraph
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GraphView"
          description: OK
      summary: "Frozen graph, runtime steps and masked execution state"
      tags:
      - Workflow execution
  /workflow/api/processes/{id}/logs:
    get:
      description: Oldest first.
      operationId: getProcessLogs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
          description: "Its log, oldest first."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: The process's log
      tags:
      - Processes
  /workflow/api/processes/{id}/migrate:
    post:
      description: "RUNNING, PAUSED or ERROR. Each step becomes the target's step\
        \ of the same id (when its type is compatible) or the one `stepMapping` names,\
        \ keeping what the process has done: a task in flight is kept when its contract\
        \ did not change and re-dispatched when it did, timers and message waits are\
        \ re-armed, steps the target adds run when their preconditions hold. Planned\
        \ first: a plan with an error is refused with `409` and its problems — see\
        \ the dry run. Recorded, with the caller and the reason, in the process's\
        \ log."
      operationId: migrateProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No reason, no such version, or over the input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or its definition is gone."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The migration is refused; the detail lists why.
      summary: Move a live process onto another version of its definition
      tags:
      - Processes
  /workflow/api/processes/{id}/migrate/dry-run:
    post:
      description: "What `migrate` would do with the same body — the effective mapping,\
        \ every step's fate and the problems (an ERROR refuses it) — changing nothing.\
        \ The reason is not needed."
      operationId: dryRunProcessMigration
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MigrateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MigrationPlan"
          description: The plan.
        "400":
          content:
            application/problem+json:
              schema:
