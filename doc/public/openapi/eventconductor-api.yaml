          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Restart a stopped process from the beginning
      tags:
      - Processes
  /workflow/api/processes/{id}/resume:
    post:
      description: "PAUSED only: clocks shift by the pause and the flow moves on."
      operationId: resumeProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
