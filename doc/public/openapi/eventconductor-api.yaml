  /workflow/api/workers/activate:
    post:
      description: Waits up to waitMs (capped by workflow.workers.http.max-wait) for
        tasks of the given topics and leases them to the caller. An empty list means
        the wait ran out.
      operationId: activateTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
          description: "The leased tasks, possibly none."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No workerId or topics.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many activations waiting on this node (Retry-After).
      summary: Long-poll for tasks
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/complete:
    post:
      description: Reports the task done with its output variables; echo the attempt
        it was activated with.
      operationId: completeTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Complete a task
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/fail:
    post:
      description: "Reports a failure: code and message become the reason; retryable=false\
        \ fails the step without spending its retries."
      operationId: failTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Fail a task
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/heartbeat:
    post:
      description: "Extends the lease of a running task; cancelled=true means the\
        \ engine cancelled it: stop and report nothing."
      operationId: heartbeatTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
          description: "The new deadline, or cancelled."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No leaseToken.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The task is gone.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "LEASE_LOST: the lease expired and the task was given to another\
            \ worker."
      summary: Extend a task's lease
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/inject:
    post:
      description: Adds steps to the process of a DYNAMIC step's task; complete the
        task afterwards.
      operationId: injectSteps
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Inject steps (DYNAMIC)
      tags:
      - Workers
components:
  schemas:
    ActivateRequest:
      type: object
      properties:
        leaseMs:
          type: integer
          format: int64
        maxTasks:
          type: integer
          format: int32
        topics:
          type: array
          items:
            type: string
        waitMs:
          type: integer
          format: int64
        workerId:
          type: string
    ActivatedTask:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        deadline:
          type: string
        delivery:
          type: integer
          format: int32
        id:
          type: string
        leaseToken:
          type: string
        processId:
          type: string
        stepId:
          type: string
        taskId:
          type: string
        topic:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        workflowDefinitionId:
          type: string
    Activation:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ActivatedTask"
    CommandAccepted:
      type: object
      description: "A command was accepted (202). It is carried out asynchronously\
        \ by the node that owns the process: read the process to see the outcome."
      properties:
        command:
          type: string
          description: "cancel, pause, resume, retry, restart, retry-step, set-variables,\
            \ complete-step or retry-from-step."
        processId:
          type: string
        stepExecutionId:
          type: string
          description: "The step execution, for retry-step and complete-step."
        stepId:
          type: string
          description: "The definition's step, for retry-from-step."
    CompleteRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        variables:
          type: object
          additionalProperties: {}
    CompleteStepRequest:
      type: object
      description: A manual completion of a step execution.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: "Payment taken by phone, ref 8812"
        variables:
          type: object
          additionalProperties: {}
          description: What the step returns — written onto the process as a worker's
            reply would be. A non-string value is stored as its JSON.
      required:
      - reason
    EventReceipt:
      type: object
      properties:
        businessKey:
          type: string
        correlationKey:
          type: string
        destination:
          type: string
        detail:
          type: string
        eventId:
          type: string
        eventSource:
          type: string
        eventType:
          type: string
        kind:
          type: string
          enum:
          - TRIGGER
          - WAIT
        messageName:
          type: string
        outcome:
          type: string
          enum:
          - STARTED
          - DELIVERED
          - ERROR
        receiptKey:
          type: string
        receivedAt:
          type: string
          format: date-time
        receiver:
          type: string
        triggerId:
          type: string
        workflowId:
          type: string
    FailRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    HeartbeatRequest:
      type: object
      properties:
        extendMs:
          type: integer
          format: int64
        leaseToken:
          type: string
    HeartbeatResponse:
      type: object
      properties:
        cancelled:
          type: boolean
        deadline:
          type: string
    Incident:
      type: object
      description: "One incident: a step of a definition failing with one family of\
        \ error."
      properties:
        definitionId:
          type: string
        errorFamily:
          type: string
          description: "The error message with ids, numbers and quoted values taken\
            \ out."
        failedSteps:
          type: integer
          format: int32
          description: Failed step executions in the group.
        firstSeen:
          type: string
        key:
          type: string
          description: "Stable id of the group — what /{key}/processes and /{key}/retry\
            \ take."
        lastSeen:
          type: string
        processes:
          type: integer
          format: int32
          description: Distinct processes they belong to.
        sampleError:
          type: string
          description: "The most recent error message of the group, as logged."
        stepId:
          type: string
          description: The definition's step that failed.
    IncidentList:
      type: object
      description: "The incidents, most failures first."
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        scanned:
          type: integer
          format: int32
          description: Failed steps read.
        truncated:
          type: boolean
          description: "Whether there were more than workflow.incidents.scan-limit:\
            \ the counts are then of the most recent."
    IncidentMember:
      type: object
      description: One failed step of an incident.
      properties:
        businessKey:
          type: string
        error:
          type: string
        failedAt:
          type: string
        processId:
          type: string
        status:
          type: string
          description: ERROR or TIMEOUT.
        stepExecutionId:
          type: string
    IncidentRetryAccepted:
      type: object
      description: A group retry was accepted (202).
      properties:
        async:
          type: boolean
          description: Whether they are being requested in the background (more than
            workflow.incidents.retry.sync-limit).
        key:
          type: string
        requested:
          type: integer
          format: int32
          description: Step retries requested.
        truncated:
          type: boolean
          description: Whether the group held more than workflow.incidents.retry.max-steps;
            retry again for the rest.
    InjectRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        steps: {}
    InvocationResponse:
      type: object
      properties:
        compensation:
          type: string
        error:
          type: string
        invocationId:
          type: string
        location:
          type: string
        outcome:
          type: string
        processId:
          type: string
        processStatus:
          type: string
        repliedAt:
          type: string
          format: date-time
        reply:
          type: string
    LogEntry:
      type: object
      description: A line of the process's log.
      properties:
        message:
          type: string
        stepExecutionId:
          type: string
        timestamp:
          type: string
        type:
          type: string
          description: "The message type (INFO, ERROR, …)."
        workerId:
          type: string
    OperationReason:
      type: object
      description: The reason a manual operation is performed.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: Partner API fixed; re-run the booking
      required:
      - reason
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Process:
      type: object
      description: "A process, with its variables."
      properties:
        businessKey:
          type: string
        completionPercentage:
          type: integer
          format: int32
          description: 0–100.
        created:
          type: string
        definitionId:
          type: string
          description: Id of the workflow definition it runs.
        definitionVersion:
          type: integer
          format: int32
          description: Version of the definition it was created from.
        finished:
          type: string
        id:
          type: string
        name:
          type: string
          description: The definition's name.
        parentStepExecutionId:
          type: string
          description: The PROCESS step execution that spawned it; null for a top-level
            process.
        pausedAt:
          type: string
          description: When it was paused; null unless PAUSED.
        started:
          type: string
        status:
          type: string
          description: "PENDING, RUNNING, PAUSED, COMPLETED, CANCELLED, ERROR, COMPENSATED\
            \ or COMPENSATION_FAILED."
        variables:
          type: object
          additionalProperties:
            type: string
    ProcessPage:
      type: object
      description: "One page of the listing, newest first."
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummary"
        page:
          type: integer
          format: int32
          description: Zero-based number of the page served — the last real page when
            the one asked for is past the end.
        size:
          type: integer
          format: int32
          description: Page size applied.
        totalElements:
          type: integer
          format: int64
          description: How many processes match the filter across every page.
        totalPages:
          type: integer
          format: int32
    ProcessSummary:
      type: object
      description: "A process as the listing shows it: no variables."
      properties:
        businessKey:
          type: string
        completionPercentage:
          type: integer
          format: int32
        created:
          type: string
        definitionId:
          type: string
        finished:
          type: string
        id:
          type: string
        name:
          type: string
        started:
          type: string
        status:
          type: string
    Result:
      type: object
      properties:
        destination:
          type: string
        duplicates:
          type: array
          items:
            type: string
        eventId:
          type: string
        eventSource:
          type: string
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/EventReceipt"
    RunNowResult:
      type: object
      properties:
        businessKey:
          type: string
        scheduleId:
          type: string
        workflowId:
          type: string
    ScheduleBody:
      type: object
      properties:
        cron:
          type: string
        id:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        workflowId:
          type: string
        zone:
          type: string
    ScheduleView:
      type: object
      properties:
        alsoDeclaredIn:
          type: array
          items:
            type: string
        cron:
          type: string
        declaredIn:
          type: string
        description:
          type: string
        editable:
          type: boolean
        effectiveZone:
          type: string
        id:
          type: string
        idDeclared:
          type: boolean
        nextFires:
          type: array
          items:
            type: string
        origin:
          type: string
        paused:
          type: boolean
        pausedAt:
          type: string
        pausedBy:
          type: string
        source:
          type: string
        sourceLabel:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - WORKFLOW_INACTIVE
          - INVALID
        variables:
          type: object
          additionalProperties:
            type: string
        workflowId:
          type: string
        workflowName:
          type: string
        zone:
          type: string
    SendMessageRequest:
      type: object
      properties:
        correlationKey:
          type: string
          minLength: 1
        messageName:
          type: string
          minLength: 1
        variables:
          type: object
          additionalProperties:
            type: string
      required:
      - correlationKey
      - messageName
    SetVariablesRequest:
      type: object
      description: A manual change of a live process's variables.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: Customer corrected the delivery date by phone
        remove:
          type: array
          description: Names of variables to delete.
          items:
            type: string
        set:
          type: object
          additionalProperties: {}
          description: "Variables to write — created, or overwritten. A non-string\
            \ value is stored as its JSON."
      required:
      - reason
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    StartBody:
      type: object
      properties:
        businessKey:
          type: string
        variables:
          type: object
          additionalProperties: {}
    StartProcessRequest:
      type: object
      description: What to start.
      properties:
        businessKey:
          type: string
          description: "Business identifier, unique across processes. Starting again\
            \ with the same key and definition returns the existing process (200)\
            \ instead of a second one."
          example: ORDER-1001
        definitionId:
          type: string
          description: Id of the workflow definition to run.
          example: order-fulfilment
        variables:
          type: object
          additionalProperties: {}
          description: Initial process variables. A non-string value is stored as
            its JSON.
      required:
      - definitionId
    StepExecution:
      type: object
      description: One step execution of a process.
      properties:
        attemptCount:
          type: integer
          format: int32
          description: Attempts made so far.
        awaitingCorrelationKey:
          type: string
          description: The correlation key that message must carry.
        awaitingMessageName:
          type: string
          description: "The message the step is waiting for: a WAIT_FOR_MESSAGE step,\
            \ or an HTTP_CALL / PUBLISH_EVENT step with awaitReply waiting for its\
            \ reply."
        deadlineAt:
          type: string
          description: "When it times out, when it has a deadline."
        finishedAt:
          type: string
        id:
          type: string
          description: "Step execution id — what /steps/{stepExecutionId}/retry takes."
        itemIndex:
          type: integer
          format: int32
          description: "For a forEach iteration, its 0-based position in the list;\
            \ null otherwise."
        iteration:
          type: integer
          format: int32
          description: "The loop pass this execution belongs to: 0 for a step's first\
            \ run, one more each time a repeat or loopBack runs it again."
        order:
          type: integer
          format: int64
          description: Position in the process.
        parentExecutionId:
          type: string
          description: "For a forEach iteration, the id of the step execution it belongs\
            \ to (its container); null for every other execution."
        startedAt:
          type: string
        status:
          type: string
          description: "CREATED, PENDING, WAITING_ON_LOCK, RUNNING, AWAITING_RETRY,\
            \ COMPLETED, ERROR, TIMEOUT or CANCELLED."
        stepId:
          type: string
          description: Id of the step in the definition.
        superseded:
          type: boolean
          description: "True when a later pass of a loop replaced this execution (or\
            \ a restart discarded it): history, not the step's current execution."
        workerId:
          type: string
          description: "Worker that ran it, when one did."
    TriggerBody:
      type: object
      properties:
        businessKey:
          type: string
        destination:
          type: string
        filter:
          type: string
        id:
          type: string
        type:
          type: string
        variables:
          type: object
          additionalProperties: {}
        workflowId:
          type: string
    TriggerView:
      type: object
      properties:
        businessKey:
          type: string
        declaredIn:
          type: string
        destination:
          type: string
        duplicateOf:
          type: string
        editable:
          type: boolean
        filter:
          type: string
        origin:
          type: string
        paused:
          type: boolean
        pausedAt:
          type: string
          format: date-time
        pausedBy:
          type: string
        source:
          type: string
        sourceLabel:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - INACTIVE
          - DUPLICATE
        topic:
          type: string
        triggerId:
          type: string
        type:
          type: string
        variables:
          type: object
          additionalProperties: {}
        workflowId:
          type: string
        workflowName:
          type: string
        workflowPaused:
          type: boolean
        workflowStatus:
          type: string
  securitySchemes:
    apiKey:
      in: header
      name: X-Api-Key
      type: apiKey
