openapi: 3.1.0
info:
  description: "The engine's REST API under /workflow/api: processes, messages, events\
    \ and triggers, schedules and synchronous invocations. Every operation takes the\
    \ X-Api-Key header when workflow.message-api.api-key is set; with Spring Security\
    \ the application's own authentication applies instead."
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  title: EventConductor engine API
  version: v1
servers:
- url: /
security:
- apiKey: []
tags:
- description: "Workers over HTTP: long-poll for tasks and answer them, in any language."
  name: Workers
- description: "Failures waiting for an operator, grouped by definition, step and\
    \ error family."
  name: Incidents
- description: "Start, read, list and operate processes."
  name: Processes
paths:
  /workflow/api/definitions/{definitionId}/invocations:
    get:
      operationId: getByKey
      parameters:
      - in: path
        name: definitionId
        required: true
        schema:
          type: string
      - in: query
        name: idempotencyKey
        required: true
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
          description: OK
      tags:
      - sync-invocation-controller
    post:
      operationId: invoke
      parameters:
      - in: path
        name: definitionId
        required: true
        schema:
          type: string
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      - in: query
        name: follow
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartBody"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - sync-invocation-controller
  /workflow/api/events/received:
    get:
      operationId: received
      parameters:
      - in: query
        name: workflowId
        required: false
        schema:
          type: string
      - in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventReceipt"
          description: OK
      tags:
      - event-rest-controller
  /workflow/api/events/{destination}:
    post:
      operationId: publish
      parameters:
      - in: path
        name: destination
        required: true
        schema:
          type: string
      - in: query
        name: key
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Result"
          description: OK
      tags:
      - event-rest-controller
  /workflow/api/incidents:
    get:
      description: "The failed steps of failed (ERROR) processes, grouped by definition,\
        \ step and error family, most failures first."
      operationId: listIncidents
      parameters:
      - description: Only this definition's.
        in: query
        name: definitionId
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentList"
          description: The incidents.
      summary: List incidents
      tags:
      - Incidents
  /workflow/api/incidents/{key}/processes:
    get:
      description: Most recent first — the drill-down to its processes.
      operationId: listIncidentProcesses
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      - description: "At most this many, 1–500."
        in: query
        name: limit
        required: false
        schema:
          type: integer
          format: int32
          default: 100
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IncidentMember"
          description: Its failed steps.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such incident (any more).
      summary: The failed steps of one incident
      tags:
      - Incidents
  /workflow/api/incidents/{key}/retry:
    post:
      description: "Each as a step retry: on the node that owns its process, under\
        \ its lock, recorded in the process's log with the caller and the reason.\
        \ Bounded by workflow.incidents.retry.max-steps; beyond workflow.incidents.retry.sync-limit\
        \ the retries are requested in the background."
      operationId: retryIncident
      parameters:
      - in: path
        name: key
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationReason"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentRetryAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No reason.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the definition.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such incident (any more).
      summary: Retry every failed step of one incident
      tags:
      - Incidents
  /workflow/api/invocations/{invocationId}:
    get:
      operationId: get_1
      parameters:
      - in: path
        name: invocationId
        required: true
        schema:
          type: string
      - in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: header
        name: Last-Event-ID
        required: false
        schema:
          type: string
      - in: query
        name: follow
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvocationResponse"
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseEmitter"
          description: OK
      tags:
      - sync-invocation-controller
  /workflow/api/messages:
    post:
      operationId: sendMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
      tags:
      - message-rest-controller
  /workflow/api/processes:
    get:
      description: "One page of processes, newest first, narrowed by every filter\
        \ given (ANDed). Served from the process index (workflow.projection.enabled)\
        \ when only q is given, from the engine's store otherwise — the same rule\
        \ as the admin console's listing."
      operationId: listProcesses
      parameters:
      - description: Only processes of this definition.
        in: query
        name: definitionId
        required: false
        schema:
          type: string
      - description: Only processes of the definitions carrying this tag (case-insensitive).
        in: query
        name: tag
        required: false
        schema:
          type: string
      - description: Only processes in any of these statuses; repeat it or separate
          with commas.
        in: query
        name: status
        required: false
        schema:
          type: array
          items:
            type: string
      - description: "Created at or after: an ISO date-time, or a date (its first\
          \ moment)."
        in: query
        name: from
        required: false
        schema:
          type: string
      - description: "Created at or before: an ISO date-time, or a date (its last\
          \ moment)."
        in: query
        name: to
        required: false
        schema:
          type: string
      - description: Business key contains this (case-insensitive).
        in: query
        name: businessKey
        required: false
        schema:
          type: string
      - description: Name or business key contains this (case-insensitive).
        in: query
        name: q
        required: false
        schema:
          type: string
      - description: Zero-based page.
        in: query
        name: page
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - description: "Page size, 1–500."
        in: query
        name: size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessPage"
          description: One page of processes.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: A malformed filter or page.
      summary: List processes
      tags:
      - Processes
    post:
      description: "Starts a process of the definition. Idempotent on the business\
        \ key: the same key and definition again returns the existing process with\
        \ 200."
      operationId: startProcess
      parameters:
      - description: "W3C trace context: the process joins the caller's trace."
        in: header
        name: traceparent
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartProcessRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: A process of this definition already has the business key.
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: Started; Location names the new process.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No definitionId, or over the engine's input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not start the definition.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such definition.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The key is taken by another definition's process, or the definition\
            \ accepts no new processes."
      summary: Start a process
      tags:
      - Processes
  /workflow/api/processes/by-key:
    get:
      description: Exact match.
      operationId: getProcessByBusinessKey
      parameters:
      - in: query
        name: businessKey
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: The process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No process has the key.
      summary: Find a process by its business key
      tags:
      - Processes
  /workflow/api/processes/{id}:
    get:
      operationId: getProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Process"
          description: The process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: Get a process
      tags:
      - Processes
  /workflow/api/processes/{id}/cancel:
    post:
      description: Its live steps are cancelled and the workers told. Not for a COMPLETED
        process.
      operationId: cancelProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Cancel a process
      tags:
      - Processes
  /workflow/api/processes/{id}/logs:
    get:
      description: Oldest first.
      operationId: getProcessLogs
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LogEntry"
          description: "Its log, oldest first."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: The process's log
      tags:
      - Processes
  /workflow/api/processes/{id}/pause:
    post:
      description: "PENDING or RUNNING: no new steps start and timer/timeout clocks\
        \ freeze."
      operationId: pauseProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Pause a process
      tags:
      - Processes
  /workflow/api/processes/{id}/restart:
    post:
      description: "ERROR or CANCELLED: every step runs again, including the ones\
        \ that succeeded, with the variables it was created with."
      operationId: restartProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Restart a stopped process from the beginning
      tags:
      - Processes
  /workflow/api/processes/{id}/resume:
    post:
      description: "PAUSED only: clocks shift by the pause and the flow moves on."
      operationId: resumeProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Resume a paused process
      tags:
      - Processes
  /workflow/api/processes/{id}/retry:
    post:
      description: "ERROR or CANCELLED: the failed (or cancelled) steps run again;\
        \ the ones that succeeded are left alone."
      operationId: retryProcess
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Retry a stopped process from where it stopped
      tags:
      - Processes
  /workflow/api/processes/{id}/retry-from/{stepId}:
    post:
      description: "The step and every step downstream of it go back to the state\
        \ they were created in and the flow runs from there; the rest is left as it\
        \ is. RUNNING, PAUSED or ERROR (a failed process runs again). Refused while\
        \ a saga rollback is under way, for a step that has not run yet, and when\
        \ another failure is not downstream of the step."
      operationId: retryProcessFromStep
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: The definition's step id (not a step execution's).
        in: path
        name: stepId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationReason"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No reason.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or it has no such step."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The retry is refused; the detail says why.
      summary: Run a live process again from one of its steps
      tags:
      - Processes
  /workflow/api/processes/{id}/steps:
    get:
      description: In the order they were created.
      operationId: getProcessSteps
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StepExecution"
          description: Its step executions.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: The process's step executions
      tags:
      - Processes
  /workflow/api/processes/{id}/steps/{stepExecutionId}/complete:
    post:
      description: "As if its worker had answered COMPLETED with `variables`: a PENDING,\
        \ RUNNING, AWAITING_RETRY, ERROR or TIMEOUT step of a RUNNING, PAUSED or ERROR\
        \ process. A step still at a worker is told to stop and its late answer is\
        \ dropped; the flow carries on past it, and a failed process whose last failure\
        \ this was runs again. Refused while a saga rollback is under way."
      operationId: completeStepExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: stepExecutionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteStepRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No reason, or over the input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or no such step execution of it."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process or the step is not in a status it is done from.
      summary: Complete a step execution by hand
      tags:
      - Processes
  /workflow/api/processes/{id}/steps/{stepExecutionId}/retry:
    post:
      description: "An ERROR or TIMEOUT step of a process that is not finished (CANCELLED,\
        \ COMPLETED, COMPENSATED, COMPENSATION_FAILED)."
      operationId: retryStepExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: stepExecutionId
        required: true
        schema:
          type: string
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or no such step execution of it."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "The step did not fail, or the process is finished."
      summary: Retry one failed step execution
      tags:
      - Processes
  /workflow/api/processes/{id}/variables:
    get:
      description: By name; values are strings.
      operationId: getProcessVariables
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
          description: "Its variables, by name."
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
      summary: The process's variables
      tags:
      - Processes
    post:
      description: "RUNNING, PAUSED or ERROR: writes `set` and deletes `remove`. A\
        \ waiting message's correlation key and a timer computed from a variable follow\
        \ the change; on a RUNNING process a step held by a link guard is released\
        \ if the guard now holds. Recorded, with the caller and the reason, in the\
        \ process's log. An admin operation: see the security notes."
      operationId: setProcessVariables
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetVariablesRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandAccepted"
          description: Accepted.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No reason, nothing to change, or over the input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process is not live.
      summary: Change a live process's variables
      tags:
      - Processes
  /workflow/api/schedules:
    get:
      operationId: list
      parameters:
      - in: query
        name: workflowId
        required: false
        schema:
          type: string
      - in: query
        name: q
        required: false
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduleView"
          description: OK
      tags:
      - schedule-rest-controller
    post:
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleBody"
        required: true
