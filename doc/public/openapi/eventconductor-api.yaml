      tags:
      - Updates
  /workflow/api/workers/activate:
    post:
      description: Waits up to waitMs (capped by workflow.workers.http.max-wait) for
        tasks of the given topics and leases them to the caller. An empty list means
        the wait ran out.
      operationId: activateTasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Activation"
          description: "The leased tasks, possibly none."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No workerId or topics.
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many activations waiting on this node (Retry-After).
      summary: Long-poll for tasks
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/complete:
    post:
      description: Reports the task done with its output variables; echo the attempt
        it was activated with.
      operationId: completeTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Complete a task
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/fail:
    post:
      description: "Reports a failure: code and message become the reason; retryable=false\
        \ fails the step without spending its retries."
      operationId: failTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FailRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Fail a task
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/heartbeat:
    post:
      description: "Extends the lease of a running task; cancelled=true means the\
        \ engine cancelled it: stop and report nothing."
      operationId: heartbeatTask
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HeartbeatRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
          description: "The new deadline, or cancelled."
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No leaseToken.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The task is gone.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "LEASE_LOST: the lease expired and the task was given to another\
            \ worker."
      summary: Extend a task's lease
      tags:
      - Workers
  /workflow/api/workers/tasks/{id}/inject:
    post:
      description: Adds steps to the process of a DYNAMIC step's task; complete the
        task afterwards.
      operationId: injectSteps
      parameters:
      - description: The task id (the step execution id) from the activation.
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InjectRequest"
      responses:
        "204":
          description: Taken.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Malformed request (for example a missing attempt).
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such task waiting for a reply: answered already, cancelled\
            \ and dropped, or never served over HTTP."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "STALE_ATTEMPT (the step ran again), or CANCELLED: drop the\
            \ task."
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The engine could not take the reply; retry it (Retry-After).
      summary: Inject steps (DYNAMIC)
      tags:
      - Workers
components:
  schemas:
    ActivateRequest:
      type: object
      properties:
        leaseMs:
          type: integer
          format: int64
        maxTasks:
          type: integer
          format: int32
        topics:
          type: array
          items:
            type: string
        waitMs:
          type: integer
          format: int64
        workerId:
          type: string
    ActivatedTask:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        deadline:
          type: string
        delivery:
          type: integer
          format: int32
        id:
          type: string
        leaseToken:
          type: string
        processId:
          type: string
        stepId:
          type: string
        taskId:
          type: string
        topic:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        workflowDefinitionId:
          type: string
    Activation:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/ActivatedTask"
    AgentInvocation:
      type: object
      description: "The invocation of a published agent by an AGENT step execution.\
        \ Never its request or result: those are the process's variables."
      properties:
        holdReason:
          type:
          - string
          - "null"
          description: "Why the engine held it: TIMEOUT (its timeout passed), CANCELLED\
            \ (the process was cancelled), END (an END transition cancelled it while\
            \ in flight); null when the runtime asked for the review, or there is\
            \ no hold."
        invocationId:
          type: string
          description: The invocation id the agent runtime correlates every reply
            and cancellation with. Stable across redeliveries; a restart of the process
            starts a new one.
        lastStateSequence:
          type:
          - integer
          - "null"
          format: int64
          description: "The last state sequence accepted from the runtime: older or\
            \ repeated replies are ignored."
        underReview:
          type: boolean
          description: "True while the invocation is held for review (the step is\
            \ REVIEW_REQUIRED and the process PAUSED): only the runtime's correlated\
            \ reconciliation releases it."
    BatchOperationFilter:
      type: object
      properties:
        businessKey:
          type: string
        createdFrom:
          type: string
          format: date-time
        createdTo:
          type: string
          format: date-time
        incident:
          type: string
        onlyErrors:
          type: boolean
        query:
          type: string
        searchText:
          type: string
        status:
          type: array
          items:
            type: string
            enum:
            - PENDING
            - RUNNING
            - PAUSED
            - COMPLETED
            - CANCELLED
            - ERROR
            - COMPENSATED
            - COMPENSATION_FAILED
          uniqueItems: true
        tag:
          type: string
        workflowDefinitionId:
          type: string
    BatchOperationView:
      type: object
      description: A batch operation and its progress.
      properties:
        createdAt:
          type: string
        createdBy:
          type: string
        errors:
          type: array
          description: "A sample of the failures, 'processId: message'."
          items:
            type: string
        failed:
          type: integer
          format: int64
        failure:
          type: string
          description: Why the batch itself failed; null otherwise.
        filter:
          $ref: "#/components/schemas/BatchOperationFilter"
          description: "The filter, as stored (the query normalised)."
        filterDescription:
          type: string
          description: The filter in one line.
        finishedAt:
          type: string
        id:
          type: string
        matched:
          type: integer
          format: int64
          description: Processes the filter matched when the batch was created (an
            estimate while it runs; the number visited once it completes).
        parameters:
          type: object
          additionalProperties:
            type: string
          description: "What the type takes: reason, stepId, set.<name>, remove.<name>;\
            \ MIGRATE targetVersion, fromVersion, map.<source step>, var.<name>."
        percent:
          type: integer
          format: int32
          description: 0–100.
        processed:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        skippedByReason:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: "Skipped processes by reason: notApplicable (status), notAuthorized,\
            \ gone."
        startedAt:
          type: string
        status:
          type: string
          description: "CREATED, RUNNING, COMPLETED, FAILED or CANCELLED."
        succeeded:
          type: integer
          format: int64
        type:
          type: string
          description: "CANCEL, RETRY, RESTART, PAUSE, RESUME, SET_VARIABLES, RETRY_FROM_STEP\
            \ or MIGRATE."
    ChildProcessView:
      type: object
      properties:
        continuedAs:
          type: string
        continuedFrom:
          type: string
        created:
          type: string
        definitionId:
          type: string
        definitionVersion:
          type: integer
          format: int32
        id:
          type: string
        itemIndex:
          type: integer
          format: int32
        iteration:
          type: integer
          format: int32
        name:
          type: string
        parentStepExecutionId:
          type: string
        status:
          type: string
        stepId:
          type: string
    ChildrenPage:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ChildProcessView"
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    CommandAccepted:
      type: object
      description: "A command was accepted (202). It is carried out asynchronously\
        \ by the node that owns the process: read the process to see the outcome."
      properties:
        command:
          type: string
          description: "cancel, pause, resume, retry, restart, retry-step, set-variables,\
            \ complete-step, retry-from-step or migrate."
        processId:
          type: string
        stepExecutionId:
          type: string
          description: "The step execution, for retry-step and complete-step."
        stepId:
          type: string
          description: "The definition's step, for retry-from-step."
    CompleteRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        variables:
          type: object
          additionalProperties: {}
    CompleteStepRequest:
      type: object
      description: A manual completion of a step execution.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: "Payment taken by phone, ref 8812"
        variables:
          type: object
          additionalProperties: {}
          description: What the step returns — written onto the process as a worker's
            reply would be. A non-string value is stored as its JSON.
      required:
      - reason
    CreateBatchOperationRequest:
      type: object
      description: A batch operation to create.
      properties:
        filter:
          $ref: "#/components/schemas/FilterBody"
        fromVersion:
          type: integer
          format: int32
          description: "MIGRATE: only the processes on this version; the others are\
            \ skipped as not applicable."
        reason:
          type: string
          description: "Why — mandatory for SET_VARIABLES, RETRY_FROM_STEP and MIGRATE,\
            \ recorded in each process's audit trail."
        remove:
          type: array
          description: "SET_VARIABLES: the variables to remove."
          items:
            type: string
        stepId:
          type: string
          description: "RETRY_FROM_STEP: the step (a definition step id) to run each\
            \ process again from."
        stepMapping:
          type: object
          additionalProperties:
            type: string
          description: "MIGRATE: source step id → target step id, the same for every\
            \ process."
        targetVersion:
          type: integer
          format: int32
          description: "MIGRATE: the version to move to; absent for the definition\
            \ as it is now."
        type:
          type: string
          description: "CANCEL, RETRY, RESTART, PAUSE, RESUME, SET_VARIABLES, RETRY_FROM_STEP\
            \ or MIGRATE."
        variables:
          type: object
          additionalProperties: {}
          description: "SET_VARIABLES: the variables to set; MIGRATE: the variables\
            \ the migration sets — by name (a non-string value is kept as its JSON)."
      required:
      - filter
      - type
    EventReceipt:
      type: object
      properties:
        businessKey:
          type: string
        correlationKey:
          type: string
        destination:
          type: string
        detail:
          type: string
        eventId:
          type: string
        eventSource:
          type: string
        eventType:
          type: string
        kind:
          type: string
          enum:
          - TRIGGER
          - WAIT
        messageName:
          type: string
        outcome:
          type: string
          enum:
          - STARTED
          - DELIVERED
          - ERROR
          - DEBOUNCED
          - THROTTLED
          - DROPPED
          - SKIPPED
          - REPLACED
        receiptKey:
          type: string
        receivedAt:
          type: string
          format: date-time
        receiver:
          type: string
        triggerId:
          type: string
        workflowId:
          type: string
    FailRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    FilterBody:
      type: object
      description: Which processes a batch acts on — the process listing's filter.
        At least one field.
      properties:
        attributes:
          type: object
          additionalProperties:
            type: string
          description: "Search attributes by name: exact for a keyword, contains for\
            \ a text (ANDed with query)."
        businessKey:
          type: string
          description: Business key contains this (case-insensitive).
        definitionId:
          type: string
          description: Only processes of this definition.
        from:
          type: string
          description: "Created at or after: an ISO date-time or date."
        onlyErrors:
          type: boolean
          description: Only ERROR processes.
        q:
          type: string
          description: Name or business key contains this (case-insensitive).
        query:
          type: string
          description: "Search-attribute conditions joined by AND: customerId = \"\
            C-9\" AND amount > 100."
        status:
          type: array
          description: Only processes in any of these statuses.
          items:
            type: string
        tag:
          type: string
          description: Only processes of the definitions carrying this tag.
        to:
          type: string
          description: "Created at or before: an ISO date-time or date (its last moment)."
    GraphView:
      type: object
      properties:
        definition:
          type: string
          description: "Frozen graph topology; request, credential and prompt blocks\
            \ are omitted."
        overlay:
          type: object
          additionalProperties: {}
        parentProcessId:
          type: string
        process:
          $ref: "#/components/schemas/Process"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/StepExecution"
        testRun:
          type: boolean
    HeartbeatRequest:
      type: object
      properties:
        extendMs:
          type: integer
          format: int64
        leaseToken:
          type: string
    HeartbeatResponse:
      type: object
      properties:
        cancelled:
          type: boolean
        deadline:
          type: string
    Incident:
      type: object
      description: "One incident: a step of a definition failing with one family of\
        \ error."
      properties:
        definitionId:
          type: string
        errorFamily:
          type: string
          description: "The error message with ids, numbers and quoted values taken\
            \ out."
        failedSteps:
          type: integer
          format: int32
          description: Failed step executions in the group.
        firstSeen:
          type: string
        key:
          type: string
          description: "Stable id of the group — what /{key}/processes and /{key}/retry\
            \ take."
        lastSeen:
          type: string
        processes:
          type: integer
          format: int32
          description: Distinct processes they belong to.
        sampleError:
          type: string
          description: "The most recent error message of the group, as logged."
        stepId:
          type: string
          description: The definition's step that failed.
    IncidentList:
      type: object
      description: "The incidents, most failures first."
      properties:
        incidents:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        scanned:
          type: integer
          format: int32
          description: Failed steps read.
        truncated:
          type: boolean
          description: "Whether there were more than workflow.incidents.scan-limit:\
            \ the counts are then of the most recent."
    IncidentMember:
      type: object
      description: One failed step of an incident.
      properties:
        businessKey:
          type: string
        error:
          type: string
        failedAt:
          type: string
        processId:
          type: string
        status:
          type: string
          description: ERROR or TIMEOUT.
        stepExecutionId:
          type: string
    IncidentRetryAccepted:
      type: object
      description: A group retry was accepted (202).
      properties:
        async:
          type: boolean
          description: "Always true: the retry is a batch operation, run in the background."
        batchOperationId:
          type: string
          description: "The RETRY batch operation over the incident: GET /workflow/api/batch-operations/{id}."
        key:
          type: string
        requested:
          type: integer
          format: int32
          description: Failed steps the incident held when the retry was asked for.
        truncated:
          type: boolean
          description: Whether the incident view was truncated (workflow.incidents.scan-limit).
    InjectRequest:
      type: object
      properties:
        attempt:
          type: integer
          format: int32
        steps: {}
    InvocationResponse:
      type: object
      properties:
        compensation:
          type: string
        error:
          type: string
        invocationId:
          type: string
        location:
          type: string
        outcome:
          type: string
        processId:
          type: string
        processStatus:
          type: string
        repliedAt:
          type: string
          format: date-time
        reply:
          type: string
    LogEntry:
      type: object
      description: A line of the process's log.
      properties:
        message:
          type: string
        stepExecutionId:
          type: string
        timestamp:
          type: string
        type:
          type: string
          description: "The message type (INFO, ERROR, …)."
        workerId:
          type: string
    MigrateRequest:
      type: object
      description: A migration of a live process onto another version of its definition.
      properties:
        reason:
          type: string
          description: "Why — mandatory for the migration (not for a dry run), recorded\
            \ in the process's audit trail."
          example: v5 fixes the refund branch
        stepMapping:
          type: object
          additionalProperties:
            type: string
          description: "Source step id → target step id, over the default (the same\
            \ id, when the target has it with a compatible type). An empty target\
            \ says the step has no counterpart."
        targetVersion:
          type: integer
          format: int32
          description: The version to move to; absent for the definition as it is
            now.
          example: 5
        variableMapping:
          type: object
          additionalProperties:
            type: string
          description: Variables to set on the process as part of the migration (name
            → value).
    MigrationPlan:
      type: object
      description: "What a migration does: the mapping, every step's fate and the\
        \ problems. Any ERROR refuses it."
      properties:
        executable:
          type: boolean
          description: Whether no problem refuses it.
        fromVersion:
          type: integer
          format: int32
        mapping:
          type: object
          additionalProperties:
            type: string
          description: "The effective mapping: source step id → target step id. A\
            \ source step that is absent has no counterpart."
        problems:
          type: array
          items:
            $ref: "#/components/schemas/MigrationProblem"
        processId:
          type: string
        steps:
          type: array
          items:
            $ref: "#/components/schemas/MigrationStep"
        toVersion:
          type: integer
          format: int32
        workflowDefinitionId:
          type: string
    MigrationProblem:
      type: object
      description: A problem of a migration plan.
      properties:
        message:
          type: string
        severity:
          type: string
          description: ERROR (refuses) or WARNING.
        stepId:
          type: string
          description: "The step it is about, or absent for the process."
    MigrationStep:
      type: object
      description: One step's fate in a migration.
      properties:
        action:
          type: string
          description: "REMAP, KEEP_TASK, REDISPATCH, REARM, HISTORY, DROP, CARRY,\
            \ ADD or ADD_PASSED; absent when the step refuses the migration."
        note:
          type: string
        sourceStepId:
          type: string
          description: The step of the version the process runs; absent for a step
            the target adds.
        state:
          type: string
          description: "NOT_STARTED, ACTIVE, COMPLETED, SKIPPED or FAILED."
        targetStepId:
          type: string
          description: The step it becomes; absent when it has no counterpart.
    OperationReason:
      type: object
      description: The reason a manual operation is performed.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: Partner API fixed; re-run the booking
      required:
      - reason
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
        instance:
          type: string
          format: uri
        properties:
          type: object
          additionalProperties: {}
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
    Process:
      type: object
      description: "A process, with its variables (a sensitive variable's value reads\
        \ as ••••)."
      properties:
        businessKey:
          type: string
        completionPercentage:
          type: integer
          format: int32
          description: 0–100.
        continuedAs:
          type: string
          description: "CONTINUE_AS_NEW (2.33): the run that continues this one; null\
            \ otherwise."
        continuedFrom:
          type: string
          description: "CONTINUE_AS_NEW (2.33): the run this one continues — same\
            \ business key; null otherwise. A run purged by retention leaves the id\
            \ behind."
        created:
          type: string
        definitionId:
          type: string
          description: Id of the workflow definition it runs.
        definitionVersion:
          type: integer
          format: int32
          description: Version of the definition it was created from.
        finished:
          type: string
        id:
          type: string
        name:
          type: string
          description: The definition's name.
        outcome:
          type: string
          description: '"continued" for a COMPLETED run a CONTINUE_AS_NEW handed over
            to continuedAs; null otherwise.'
        parentStepExecutionId:
          type: string
          description: The PROCESS step execution that spawned it; null for a top-level
            process.
        pausedAt:
          type: string
          description: When it was paused; null unless PAUSED.
        searchAttributes:
          type: object
          additionalProperties:
            type: string
          description: "Its search attributes, by name, as the definition declares\
            \ them (2.30); empty when it declares none."
        started:
          type: string
        status:
          type: string
          description: "PENDING, RUNNING, PAUSED, COMPLETED, CANCELLED, ERROR, COMPENSATED\
            \ or COMPENSATION_FAILED."
        variables:
          type: object
          additionalProperties:
            type: string
    ProcessPage:
      type: object
      description: "One page of the listing, newest first."
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/ProcessSummaryView"
        page:
          type: integer
          format: int32
          description: Zero-based number of the page served — the last real page when
            the one asked for is past the end.
        size:
          type: integer
          format: int32
          description: Page size applied.
        totalElements:
          type: integer
          format: int64
          description: How many processes match the filter across every page.
        totalPages:
          type: integer
          format: int32
    ProcessSummaryView:
      type: object
      properties:
        businessKey:
          type: string
        completionPercentage:
          type: integer
          format: int32
        created:
          type: string
        definitionId:
          type: string
        finished:
          type: string
        id:
          type: string
        name:
          type: string
        started:
          type: string
        status:
          type: string
    ProcessUpdateResponse:
      type: object
      properties:
        completedAt:
          type: string
          format: date-time
        error:
          type: string
          description: "Why it was refused, not accepted or failed."
        location:
          type: string
          description: Where the update is read again.
        name:
          type: string
          description: The update's name in the definition.
        payload:
          type: string
          description: "The payload as recorded: fields the update declares sensitive\
            \ are masked."
        processId:
          type: string
        requestedAt:
          type: string
          format: date-time
        requestedBy:
          type: string
        result:
          type: string
          description: The update's reply (any JSON) when COMPLETED.
        started:
          type: boolean
          description: Whether this update started its process (update-with-start).
        status:
          type: string
          description: "REQUESTED (not applied yet: 202), COMPLETED, REFUSED, NOT_ACCEPTED\
            \ or FAILED."
        updateId:
          type: string
          description: "The update's id; GET /workflow/api/updates/{updateId} reads\
            \ it again."
    Result:
      type: object
      properties:
        destination:
          type: string
        duplicates:
          type: array
          items:
            type: string
        eventId:
          type: string
        eventSource:
          type: string
        receipts:
          type: array
          items:
            $ref: "#/components/schemas/EventReceipt"
    RevealRequest:
      type: object
      description: Why a sensitive variable's value is needed — recorded in the process's
        audit trail.
      properties:
        reason:
          type: string
          example: Chargeback investigation CB-1182
      required:
      - reason
    RevealedVariable:
      type: object
      description: "A sensitive variable's value, in clear."
      properties:
        name:
          type: string
        processId:
          type: string
        value:
          type: string
    RunNowResult:
      type: object
      properties:
        businessKey:
          type: string
        scheduleId:
          type: string
        workflowId:
          type: string
    ScheduleBody:
      type: object
      properties:
        cron:
          type: string
        id:
          type: string
        variables:
          type: object
          additionalProperties:
            type: string
        workflowId:
          type: string
        zone:
          type: string
    ScheduleView:
      type: object
      properties:
        alsoDeclaredIn:
          type: array
          items:
            type: string
        cron:
          type: string
        declaredIn:
          type: string
        description:
          type: string
        editable:
          type: boolean
        effectiveZone:
          type: string
        id:
          type: string
        idDeclared:
          type: boolean
        nextFires:
          type: array
          items:
            type: string
        origin:
          type: string
        paused:
          type: boolean
        pausedAt:
          type: string
        pausedBy:
          type: string
        source:
          type: string
        sourceLabel:
          type: string
        state:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - WORKFLOW_INACTIVE
          - INVALID
        variables:
          type: object
          additionalProperties:
            type: string
        workflowId:
          type: string
        workflowName:
          type: string
        zone:
          type: string
    SendMessageRequest:
      type: object
      properties:
        correlationKey:
          type: string
          minLength: 1
        messageName:
          type: string
          minLength: 1
        variables:
          type: object
          additionalProperties:
            type: string
      required:
      - correlationKey
      - messageName
    SetVariablesRequest:
      type: object
      description: A manual change of a live process's variables.
      properties:
        reason:
          type: string
          description: "Why — mandatory, recorded in the process's audit trail."
          example: Customer corrected the delivery date by phone
        remove:
          type: array
          description: Names of variables to delete.
          items:
            type: string
        set:
          type: object
          additionalProperties: {}
          description: "Variables to write — created, or overwritten. A non-string\
            \ value is stored as its JSON."
      required:
      - reason
    SseEmitter:
      type: object
      properties:
        timeout:
          type: integer
          format: int64
    StartBody:
      type: object
      properties:
        businessKey:
          type: string
        variables:
          type: object
          additionalProperties: {}
    StartHeldBack:
      type: object
      description: "A start the definition's startPolicy (2.33) held back: debounced\
        \ (it starts after a quiet period, with the last start's data) or throttled\
        \ (queued until a window has room). No process exists yet."
      properties:
        businessKey:
          type: string
          description: The business key the process will have when it starts (a debounce
            keeps the last start's).
        detail:
          type: string
        dueAt:
          type: string
          description: "When it is due, at the earliest."
        flowControl:
          type: string
          description: debounced or throttled.
    StartPolicy:
      type: object
      properties:
        debounce:
          type: string
        key:
          type: string
        singleton:
          type: string
        throttle:
          $ref: "#/components/schemas/Throttle"
    StartProcessRequest:
      type: object
      description: What to start.
      properties:
        businessKey:
          type: string
          description: "Business identifier, unique across processes. Starting again\
            \ with the same key and definition returns the existing process (200)\
            \ instead of a second one."
          example: ORDER-1001
        definitionId:
          type: string
          description: Id of the workflow definition to run.
          example: order-fulfilment
        variables:
          type: object
          additionalProperties: {}
          description: Initial process variables. A non-string value is stored as
            its JSON.
      required:
      - definitionId
    StepExecution:
      type: object
      description: One step execution of a process.
      properties:
        agent:
          $ref: "#/components/schemas/AgentInvocation"
          description: "For an AGENT step, its invocation of the published agent;\
            \ null for every other step."
        attemptCount:
          type: integer
          format: int32
          description: Attempts made so far.
        awaitingCorrelationKey:
          type: string
          description: The correlation key that message must carry.
        awaitingMessageName:
          type: string
          description: "The message the step is waiting for: a WAIT_FOR_MESSAGE step,\
            \ or an HTTP_CALL / PUBLISH_EVENT step with awaitReply waiting for its\
            \ reply."
        deadlineAt:
          type: string
          description: "When it times out, when it has a deadline."
        finishedAt:
          type: string
        id:
          type: string
          description: "Step execution id — what /steps/{stepExecutionId}/retry takes."
        itemIndex:
          type: integer
          format: int32
          description: "For a forEach iteration, its 0-based position in the list;\
            \ null otherwise."
        iteration:
          type: integer
          format: int32
          description: "The loop pass this execution belongs to: 0 for a step's first\
            \ run, one more each time a repeat or loopBack runs it again."
        order:
          type: integer
          format: int64
          description: Position in the process.
        parentExecutionId:
          type: string
          description: "For a forEach iteration, the id of the step execution it belongs\
            \ to (its container); null for every other execution."
        startedAt:
          type: string
        status:
          type: string
          description: "CREATED, PENDING, WAITING_ON_LOCK, RUNNING, REVIEW_REQUIRED\
            \ (an AGENT invocation held for review; its process is PAUSED), AWAITING_RETRY,\
            \ COMPLETED, ERROR, TIMEOUT or CANCELLED."
        stepId:
          type: string
          description: Id of the step in the definition.
        superseded:
          type: boolean
          description: "True when a later pass of a loop replaced this execution (or\
            \ a restart discarded it): history, not the step's current execution."
        workerId:
          type: string
          description: "Worker that ran it, when one did."
    TestRunRequest:
      type: object
      properties:
        definition:
          type: string
        runId:
          type: string
        variables:
          type: object
          additionalProperties: {}
    Throttle:
      type: object
      properties:
        limit:
          type: integer
          format: int32
        onLimit:
          type: string
        period:
          type: string
    TriggerBody:
      type: object
      properties:
        businessKey:
          type: string
        destination:
          type: string
        filter:
          type: string
        id:
          type: string
        startPolicy:
          $ref: "#/components/schemas/StartPolicy"
        type:
          type: string
        variables:
          type: object
          additionalProperties: {}
        workflowId:
          type: string
    TriggerView:
      type: object
      properties:
        businessKey:
          type: string
        declaredIn:
          type: string
        destination:
          type: string
        duplicateOf:
          type: string
        editable:
          type: boolean
        filter:
          type: string
        origin:
          type: string
        paused:
          type: boolean
        pausedAt:
          type: string
          format: date-time
        pausedBy:
          type: string
        source:
          type: string
        sourceLabel:
          type: string
        startPolicy:
          $ref: "#/components/schemas/StartPolicy"
        state:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - INACTIVE
          - DUPLICATE
        topic:
          type: string
        triggerId:
          type: string
        type:
          type: string
        variables:
          type: object
          additionalProperties: {}
        workflowId:
          type: string
        workflowName:
          type: string
        workflowPaused:
          type: boolean
        workflowStatus:
          type: string
    UpdateWithStartRequest:
      type: object
      properties:
        businessKey:
          type: string
          description: "The process's business key: the existing process with it gets\
            \ the update, or a new one is started with it."
        payload:
          type: string
          description: The update's payload (any JSON).
        update:
          type: string
          description: The update's name.
        variables:
          type: object
          additionalProperties: {}
          description: Initial variables of a process started by this call (ignored
            when it exists). Values that are not text are stored as JSON.
      required:
      - businessKey
      - update
  securitySchemes:
    apiKey:
      in: header
      name: X-Api-Key
      type: apiKey
