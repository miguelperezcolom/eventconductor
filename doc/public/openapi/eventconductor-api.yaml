  /workflow/api/processes/{id}/steps/{stepExecutionId}/complete:
    post:
      description: "As if its worker had answered COMPLETED with `variables`: a PENDING,\
        \ RUNNING, AWAITING_RETRY, ERROR or TIMEOUT step of a RUNNING, PAUSED or ERROR\
        \ process. A step still at a worker is told to stop and its late answer is\
        \ dropped; the flow carries on past it, and a failed process whose last failure\
        \ this was runs again. Refused while a saga rollback is under way."
      operationId: completeStepExecution
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: stepExecutionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteStepRequest"
      responses:
        "202":
          content:
            application/json:
