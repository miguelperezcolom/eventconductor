                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Pause a process
      tags:
      - Processes
  /workflow/api/processes/{id}/restart:
    post:
      description: "ERROR or CANCELLED: every step runs again, including the ones\
