          description: "No reason, nothing to change, or over the input limits."
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
