  /workflow/api/processes/{id}/updates/{name}:
    post:
      description: "Validates the payload against the update's `accepts` schema, then\
        \ — on the node that owns the process, under its lock — checks it is accepting,\
        \ runs the `validate` guards, writes `set` and answers `reply`. Any number\
        \ of updates over a process's life, one at a time per process."
      operationId: updateProcess
      parameters:
      - description: Makes a retry land on the same update and get its recorded outcome.
        in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
      - description: "RFC 7240 `wait=N`: seconds to wait for the outcome before answering\
          \ 202."
        in: header
        name: Prefer
        required: false
        schema:
          type: string
      - in: path
        name: id
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
        description: The update's payload (any JSON).
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Applied; `result` is the reply.
        "202":
          content:
            application/json:
              schema:
                type: object
          description: The deadline passed first; the update completes durably — read
            it at Location.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The payload is not JSON or not what the update accepts.
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not update the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or its definition declares no such update."
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process is not accepting the update now.
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "A guard refused it, or the Idempotency-Key was used for another\
            \ request."
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Too many callers waiting on this node.
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: An expression of the update failed; nothing changed.
      summary: Apply an update to a running process
      tags:
      - Updates
