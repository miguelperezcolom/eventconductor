                $ref: "#/components/schemas/ProblemDetail"
          description: The caller may not operate on the process.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "No such process, or no such step execution of it."
        "409":
          content:
            application/problem+json:
