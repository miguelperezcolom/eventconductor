          description: Accepted.
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: No such process.
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: The process's status does not allow it.
      summary: Retry a stopped process from where it stopped
      tags:
      - Processes
  /workflow/api/processes/{id}/retry-from/{stepId}:
    post:
      description: "The step and every step downstream of it go back to the state\
        \ they were created in and the flow runs from there; the rest is left as it\
        \ is. RUNNING, PAUSED or ERROR (a failed process runs again). Refused while\
        \ a saga rollback is under way, for a step that has not run yet, and when\
        \ another failure is not downstream of the step."
      operationId: retryProcessFromStep
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
      - description: The definition's step id (not a step execution's).
        in: path
        name: stepId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationReason"
      responses:
