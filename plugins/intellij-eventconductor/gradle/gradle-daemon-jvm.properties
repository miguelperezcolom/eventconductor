# Run the Gradle daemon on JDK 21 no matter which JDK invokes the wrapper. Gradle 8.10 does not
# support running on JDK 24+, so on a machine whose default is a newer JDK (e.g. 26) the build failed
# with a cryptic version string. With this Daemon JVM criteria, Gradle auto-detects an installed
# JDK 21 and relaunches the daemon on it. IntelliJ 2024.2 targets JDK 21, so this also matches the
# platform. (Auto-detection covers the usual macOS/Linux install locations; no download needed when
# a 21 is already present.)
toolchainVersion=21
