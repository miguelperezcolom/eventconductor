spring:
  application:
    name: ia-agent-service

  # 1. Configuración de Spring AI para Anthropic (Claude)
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.1

    # 2. MCP Client: conexiones SSE a los servidores MCP
    mcp:
      client:
        sse:
          connections:
            event-conductor:
              url: http://localhost:8091

server:
  port: 8095

logging:
  level:
    org.springframework.ai: DEBUG
    io.mateu.workflow: INFO
