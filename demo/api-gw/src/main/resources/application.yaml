  server:
    port: 8191
  app:
    security:
      jwt:
        keystore-path: classpath:keystore.p12
        keystore-password: riuitar
        key-alias: gatekeeper
        key-password: riuitar
  grpc:
    client:
      auth-service: # Este nombre debe coincidir con el de @GrpcClient
        address: ${AUTH_GRPC_ADDRESS:static://localhost:9191}
        negotiation-type: plaintext
  spring:
    application:
      name: api-gw
    cloud:
      gateway:
        # Plain router: authentication happens at the shell (Keycloak); the backend
        # services sit behind the gateway with no auth. Hosts are overridable per env
        # (defaults target local dev; Kubernetes overrides them with service URLs).
        routes:
          - id: static_route
            uri: ${STATIC_URL:http://localhost:8107}
            predicates:
              - Path=/static/**
          - id: forms_route
            uri: ${FORMS_URL:http://localhost:8106}
            predicates:
              - Path=/_forms/**
          - id: orchestrator_route
            uri: ${WORKFLOW_URL:http://localhost:8105}
            predicates:
              - Path=/_workflow/**
          - id: content_service_route
            uri: ${CONTENT_URL:http://localhost:8104}
            predicates:
              - Path=/_content-service/**
          - id: control_plane_route
            uri: ${CONTROL_PLANE_URL:http://localhost:8103}
            predicates:
              - Path=/_control-plane/**
          - id: control_plane_data_route
            uri: ${CONTROL_PLANE_URL:http://localhost:8103}
            predicates:
              - Path=/_cp-data/**
          - id: users_route
            uri: ${USERS_URL:http://localhost:8102}
            predicates:
              - Path=/_users/**
          - id: booking_route
            uri: ${BOOKING_URL:http://localhost:8108}
            predicates:
              - Path=/_booking/**
          - id: ai_agent_route
            uri: ${AI_URL:http://localhost:8095}
            predicates:
              - Path=/ai/**
          - id: shell_route
            uri: ${SHELL_URL:http://localhost:8101}
            predicates:
              - Path=/**
