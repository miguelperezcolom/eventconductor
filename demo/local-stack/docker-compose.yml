# Local EventConductor demo stack — booking saga journey.
# Brought up in layers: infra (this) → EC (orchestrator+forms) → booking worker.
# Keycloak/shell/api-gw are added later for the UI journey (they aren't needed to
# validate the saga headlessly).
name: ec-demo-local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: workflow
      POSTGRES_USER: user_app
      POSTGRES_PASSWORD: user_password
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_app -d workflow"]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:9192
      # in-container clients use redpanda:9092; host tools use localhost:9192
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:9192
    ports: ["9192:9192"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 4s
      timeout: 4s
      retries: 20

  orchestrator:
    image: miguelperezcolom/orchestrator-standalone-app:2.0.0
    platform: linux/amd64
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      SERVER_PORT: "8105"
      WORKFLOW_MODE: kafka
      WORKFLOW_PERSISTENCE: jpa
      KAFKA_BROKERS: redpanda:9092
      KAFKA_MIN_PARTITIONS: "6"
      DB_URL: jdbc:postgresql://postgres:5432/workflow
      DB_USERNAME: user_app
      DB_PASSWORD: user_password
      DDL_AUTO: update
      SECURITY_ENABLED: "false"
      # import the workflow defs from the local git repo (mounted below)
      WORKFLOW_GITIMPORT_REPOSITORIES_0_URL: file:///wf-repo
      WORKFLOW_GITIMPORT_REPOSITORIES_0_BRANCH: main
    volumes:
      - ./wf-repo:/wf-repo:ro
    ports: ["8105:8105"]

  forms:
    image: miguelperezcolom/forms-standalone-app:2.0.0
    platform: linux/amd64
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      SERVER_PORT: "8106"
      WORKFLOW_MODE: kafka
      WORKFLOW_PERSISTENCE: jpa
      FORMS_PERSISTENCE: jpa
      KAFKA_BROKERS: redpanda:9092
      DB_URL: jdbc:postgresql://postgres:5432/workflow
      DB_USERNAME: user_app
      DB_PASSWORD: user_password
      DDL_AUTO: update
      SECURITY_ENABLED: "false"
      FORMS_GITIMPORT_REPOSITORIES_0_URL: file:///forms-repo
      FORMS_GITIMPORT_REPOSITORIES_0_BRANCH: main
    volumes:
      - ./forms-repo:/forms-repo:ro
    ports: ["8106:8106"]

  booking:
    image: mateu-demo-booking:local
    depends_on:
      postgres: {condition: service_healthy}
      redpanda: {condition: service_healthy}
    environment:
      SERVER_PORT: "8108"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/demo
      SPRING_DATASOURCE_USERNAME: user_app
      SPRING_DATASOURCE_PASSWORD: user_password
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS: redpanda:9092
    ports: ["8108:8108"]

  # --- UI layer (milestone 5): Keycloak login + shell + api-gw router ---

  # `keycloak.local` network alias: the SAME hostname resolves from the browser
  # (Playwright --host-resolver-rules MAP keycloak.local 127.0.0.1) and from the
  # containers (this alias), so the token's `iss` claim matches on both sides.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: http://keycloak.local:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./mateu-realm.json:/opt/keycloak/data/import/mateu-realm.json:ro
    networks:
      default:
        aliases: [keycloak.local]
    ports: ["8080:8080"]

  shell:
    image: mateu-demo-shell:local
    depends_on: [keycloak]
    restart: on-failure
    environment:
      SERVER_PORT: "8101"
      # both jwk-set-uri (lazy) + issuer-uri → no OIDC discovery fetch at startup
      KEYCLOAK_ISSUER_URI: http://keycloak.local:8080/realms/mateu
      KEYCLOAK_JWKS_URI: http://keycloak.local:8080/realms/mateu/protocol/openid-connect/certs
    ports: ["8101:8101"]

  # Plain Spring Cloud Gateway router (no auth; auth happens at the shell). The
  # browser enters here; it fans /_forms, /_workflow, /_booking to the backends.
  api-gw:
    image: mateu-demo-api-gw:local
    depends_on: [shell, forms, orchestrator, booking]
    restart: on-failure
    environment:
      SERVER_PORT: "8191"
      SHELL_URL: http://shell:8101
      FORMS_URL: http://forms:8106
      WORKFLOW_URL: http://orchestrator:8105
      BOOKING_URL: http://booking:8108
    ports: ["8191:8191"]
