nodeSelector: { kubernetes.io/arch: amd64 }
tempo:
  storage:
    trace: { backend: local }
  receivers:
    otlp:
      protocols:
        http: { endpoint: "0.0.0.0:4318" }
        grpc: { endpoint: "0.0.0.0:4317" }
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 640Mi, cpu: 1 }
persistence:
  enabled: true
  storageClassName: hcloud-volumes
  size: 10Gi
