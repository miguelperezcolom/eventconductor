loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 168h
    reject_old_samples: false
    reject_old_samples_max_age: 2160h
    max_line_size: 0
    increment_duplicate_timestamp: true
  pattern_ingester: { enabled: false }
deploymentMode: SingleBinary
singleBinary:
  replicas: 1
  nodeSelector: { kubernetes.io/arch: amd64 }
  persistence: { storageClass: hcloud-volumes, size: 10Gi }
  resources:
    requests: { memory: 256Mi, cpu: 100m }
    limits: { memory: 768Mi, cpu: 1 }
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
gateway: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
monitoring:
  selfMonitoring: { enabled: false, grafanaAgent: { installOperator: false } }
  serviceMonitor: { enabled: false }
