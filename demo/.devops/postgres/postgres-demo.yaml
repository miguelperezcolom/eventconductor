apiVersion: v1
kind: Secret
metadata: { name: postgres-demo, namespace: demo }
type: Opaque
stringData:
  POSTGRES_DB: demo
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: postgres-demo, namespace: demo }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: hcloud-volumes
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres-demo, namespace: demo, labels: { app: postgres-demo } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: postgres-demo } }
  template:
    metadata: { labels: { app: postgres-demo } }
    spec:
      nodeSelector: { kubernetes.io/arch: amd64 }
      securityContext: { runAsNonRoot: true, runAsUser: 70, fsGroup: 70, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: postgres
          image: postgres:16
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          envFrom:
            - secretRef: { name: postgres-demo }
          ports: [ { containerPort: 5432 } ]
          volumeMounts: [ { name: data, mountPath: /var/lib/postgresql/data } ]
          resources: { requests: { memory: "256Mi", cpu: "100m" }, limits: { memory: "512Mi", cpu: "500m" } }
          readinessProbe:
            exec: { command: ["pg_isready","-U","demo","-d","demo"] }
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes: [ { name: data, persistentVolumeClaim: { claimName: postgres-demo } } ]
---
apiVersion: v1
kind: Service
metadata: { name: postgres-demo, namespace: demo }
spec:
  selector: { app: postgres-demo }
  ports: [ { port: 5432, targetPort: 5432 } ]
