server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name auth.mateu.io;

    ssl_certificate     /etc/letsencrypt/live/auth.mateu.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.mateu.io/privkey.pem;

    # Keycloak (KC_PROXY_HEADERS=xforwarded, KC_HOSTNAME=https://auth.mateu.io).
    location / {
        proxy_pass http://keycloak.demo.svc.cluster.local:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
