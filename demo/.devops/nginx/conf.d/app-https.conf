server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.mateu.io;

    ssl_certificate     /etc/letsencrypt/live/app.mateu.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.mateu.io/privkey.pem;

    client_max_body_size 50m;

    # Entry point of the demo: the API gateway (which routes to the shell and services).
    location / {
        proxy_pass http://api-gw.demo.svc.cluster.local:8191/;
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket / server push (Vaadin/Mateu).
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
