apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gw
  namespace: demo
  labels: { app: api-gw }
spec:
  replicas: 1
  selector:
    matchLabels: { app: api-gw }
  template:
    metadata:
      labels: { app: api-gw }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      nodeSelector: { kubernetes.io/arch: amd64 }
      containers:
        - name: api-gw
          image: miguelperezcolom/mateu-demo-api-gw:0.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          ports:
            - { containerPort: 8191 }
          env:
            - { name: SHELL_URL, value: "http://shell:8101" }
            - { name: USERS_URL, value: "http://users-service:8102" }
            - { name: CONTROL_PLANE_URL, value: "http://control-plane-service:8103" }
            - { name: CONTENT_URL, value: "http://content-service:8104" }
            - { name: BOOKING_URL, value: "http://booking-service:8108" }
            - { name: AI_URL, value: "http://ia-agent-service:8095" }
            - { name: STATIC_URL, value: "http://static-content-server:8107" }
            - { name: WORKFLOW_URL, value: "http://orchestrator.eventconductor.svc.cluster.local:8105" }
            - { name: FORMS_URL, value: "http://forms.eventconductor.svc.cluster.local:8106" }
          resources:
            requests: { memory: "448Mi", cpu: "150m" }
            limits:   { memory: "1Gi", cpu: "1" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: 8191 }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gw
  namespace: demo
  labels: { app: api-gw }
spec:
  selector: { app: api-gw }
  ports:
    - { port: 8191, targetPort: 8191 }
---
