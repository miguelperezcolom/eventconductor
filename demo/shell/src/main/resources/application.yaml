server:
  port: 8101
spring:
  application:
    name: shell
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validate access tokens against Keycloak (realm "mateu").
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:https://auth.mateu.io/realms/mateu/protocol/openid-connect/certs}
          issuer-uri: ${KEYCLOAK_ISSUER_URI:https://auth.mateu.io/realms/mateu}