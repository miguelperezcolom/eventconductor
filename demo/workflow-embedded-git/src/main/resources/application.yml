server:
  port: 8090

spring:
  application:
    name: embedded-git
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:h2:mem:workflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

workflow:
  mode: embedded
  persistence: jpa
  git-import:
    # Optional: set this to the same secret you configure in GitHub repo settings
    # webhook-secret: mysecret
    repositories:
      - url: https://github.com/miguelperezcolom/sample-workflows.git
        branch: main
