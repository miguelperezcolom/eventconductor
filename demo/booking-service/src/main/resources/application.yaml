server:
  port: 8108
spring:
  application:
    name: booking-service

  ai:
    mcp:
      server:
        name: booking-service
        version: 1.0.0

  mvc:
    async:
      request-timeout: -1   # SSE connections must not expire

  # --- Configuración de Spring Cloud Stream ---
  cloud:
    function:
      # Este servicio es solo un worker: consume tareas y responde. El motor corre en el
      # orquestador, así que aquí no existen consumeOutbox ni consumeUpstream — nombrarlos
      # dejaba dos bindings fantasma, uno de ellos compartiendo grupo con el worker real.
      definition: consumeWorkerEvent
    stream:
      kafka:
        binder:
          # Centralizamos la conexión aquí para el Binder
          brokers: localhost:9192
          auto-create-topics: true
      bindings:
        # INPUT: las tareas que el motor despacha para este worker.
        # Un grupo por binding, nunca uno compartido entre bindings distintos: un grupo cuyos
        # miembros se suscriben a topics distintos deja particiones sin ningún consumidor, y esos
        # mensajes no se leen nunca. Ver la configuración del orquestador.
        consumeWorkerEvent-in-0:
          destination: downstream
          group: booking-service-group

        # OUTPUT (para StreamBridge): las respuestas al motor. Es el único al que se publica.
        upstream: # Nombre usado en streamBridge.send("upstream", ...)
          destination: upstream

  # --- Configuración de Base de Datos (PostgreSQL) ---
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/workflow
    username: user_app
    password: user_password
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- Configuración de Kafka Nativo ---
  kafka:
    bootstrap-servers: localhost:9192
    consumer:
      group-id: my-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # IMPORTANTE: Cambiado a ByteArraySerializer para evitar el ClassCastException [B cannot be cast to String
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

logging:
  level:
    org.hibernate.SQL: error
    org.hibernate.orm.jdbc.bind: error
    org.springframework.kafka: error
    org.springframework.cloud.stream: error
    #    org.hibernate.SQL: DEBUG
    #    org.hibernate.orm.jdbc.bind: TRACE
    #    org.springframework.kafka: INFO
    # He añadido este para que veas errores detallados del binder si algo falla
#    org.springframework.cloud.stream: INFO
