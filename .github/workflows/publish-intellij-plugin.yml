name: Publish IntelliJ plugin

# Publishes plugins/intellij-eventconductor to the JetBrains Marketplace.
# Trigger: push a tag like `plugins-v0.1.0`, or run manually.
# NOTE: the FIRST version must be uploaded manually via https://plugins.jetbrains.com (Upload
# plugin) and approved by JetBrains before API publishing works.
# Required repo secrets:
#   JETBRAINS_MARKETPLACE_TOKEN   — token from https://plugins.jetbrains.com/author/me/tokens
#   INTELLIJ_CERTIFICATE_CHAIN    — signing certificate chain (PEM)
#   INTELLIJ_PRIVATE_KEY          — signing private key (PEM)
#   INTELLIJ_PRIVATE_KEY_PASSWORD — private key password
# See https://plugins.jetbrains.com/docs/intellij/plugin-signing.html
on:
  push:
    tags:
      - 'plugins-v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/intellij-eventconductor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      # build.gradle.kts resolves io.mateu.workflow:worker-codegen:1.0-SNAPSHOT from mavenLocal():
      # the task-worker generator is built from this repo's Maven reactor, never published as a
      # SNAPSHOT. Install it (and the reactor poms it needs) before Gradle looks for it.
      - name: Install worker-codegen into the local Maven repository
        working-directory: .
        run: mvn -B -q -pl modules/worker-codegen -am install -DskipTests -Djacoco.skip=true
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Sign & publish to the JetBrains Marketplace
        run: ./gradlew publishPlugin
        env:
          PUBLISH_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.INTELLIJ_CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.INTELLIJ_PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.INTELLIJ_PRIVATE_KEY_PASSWORD }}
