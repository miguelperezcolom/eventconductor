name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Build, test & verify (JaCoCo enforces 85% line coverage)
        run: mvn -B -ntp verify

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 7
          if-no-files-found: ignore

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint chart
        run: helm lint charts/eventconductor

  trivy-config:
    name: Trivy IaC + secret scan
    runs-on: ubuntu-latest
    # SCA for Java/npm dependencies is intentionally out of scope here —
    # Dependabot (see .github/dependabot.yml) handles those, and running
    # Trivy's vuln scanner against pom.xml files makes it resolve transitive
    # poms from Maven Central, which rate-limits (HTTP 429) and produces
    # flaky CI. Trivy here is restricted to what it does without external
    # lookups: misconfigured IaC (Dockerfiles, Helm, Kubernetes manifests,
    # GitHub Actions) and accidentally-committed secrets.
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy on the repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scanners: misconfig,secret
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Fail the job (and the PR) when a CRITICAL/HIGH config or secret
          # finding shows up. The vuln scanner is off so no Maven Central
          # round-trip can flake the build.
          exit-code: '1'
          format: table
