name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      - name: Build, test & verify (JaCoCo enforces each module's line-coverage floor)
        run: mvn -B -ntp verify

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          retention-days: 7
          if-no-files-found: ignore

  ui-e2e:
    name: Browser suite (Playwright)
    runs-on: ubuntu-latest
    # TESTING.md §7: the engine's UI driven in a real Chromium. Kept out of the
    # default `mvn verify` reactor because the first run downloads a browser and
    # the suite is slower, and differently flaky, from everything else here.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      # test-worker too: the browser journeys drive the worker's own pages, so the module has to
      # be in the local repository before the suite resolves its dependencies.
      - name: Build the engine and the test worker (unit tests already run in the build job)
        run: mvn -B -ntp -pl modules/workflow-engine,modules/test-worker -am -DskipTests -Djacoco.skip=true install

      - name: Run the browser journeys
        run: mvn -B -ntp -Pui-e2e -pl modules/workflow-ui-e2e -Djacoco.skip=true verify

      - name: Keep what was on screen
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-e2e-screenshots
          path: modules/workflow-ui-e2e/target/ui-e2e/
          if-no-files-found: ignore

  dist-e2e:
    name: Distributed suite (Testcontainers)
    runs-on: ubuntu-latest
    # DIST-01…DIST-05 (TESTING.md §5): orchestrator + worker over real
    # PostgreSQL and Kafka via Testcontainers. Kept out of the default
    # `mvn verify` reactor because it needs Docker and takes minutes.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven

      # test-worker too: DIST-13 drives a saga through the real worker, so the module has to be in
      # the local repository before the suite resolves its dependencies.
      - name: Build engine and test worker (unit tests already run in the build job)
        run: mvn -B -ntp -pl modules/workflow-engine,modules/test-worker,modules/inbound-events-kafka -am -DskipTests -Djacoco.skip=true install

      - name: Run distributed tests (DIST-01…DIST-05)
        run: mvn -B -ntp -Pdist-e2e -pl modules/workflow-dist-e2e -Djacoco.skip=true verify

      - name: Surface DIST-05 throughput
        if: always()
        run: grep -rh "DIST-05 RESULT" modules/workflow-dist-e2e/target/surefire-reports/ | tee -a "$GITHUB_STEP_SUMMARY" || true

  helm-lint:
    name: Helm chart lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
      - name: Lint charts
        run: |
          helm lint charts/eventconductor
          helm lint charts/eventconductor-demo

  trivy-config:
    name: Trivy IaC + secret scan
    runs-on: ubuntu-latest
    # SCA for Java/npm dependencies is intentionally out of scope here —
    # Dependabot (see .github/dependabot.yml) handles those. We restrict
    # Trivy to scanning IaC misconfigurations (Dockerfiles, Kubernetes
    # manifests) and committed secrets.
    #
    # pom.xml files are excluded via skip-files even with the vuln scanner
    # off: Trivy's misconfig scanner also opens pom.xml to look for Maven
    # plugin misconfigurations and ends up resolving parent/BOM poms from
    # Maven Central, which rate-limits the runner IP (HTTP 429) and
    # produces flaky builds.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run Trivy on the repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: misconfig,secret
          skip-files: '**/pom.xml'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # Fail the job (and the PR) when a CRITICAL/HIGH config or secret
          # finding shows up.
          exit-code: '1'
          format: table
