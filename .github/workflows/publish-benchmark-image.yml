# Publishes the benchmark image on demand.
#
# Separate from build-and-publish.yml, which only fires on a release tag: a benchmark image has to
# track whatever you are measuring, which is usually a branch. Run it from the Actions tab or with
#   gh workflow run publish-benchmark-image.yml -f ref=<branch>
#
# One image serves all three roles (pods, worker, driver), so a run spread over several hosts
# cannot end up comparing different builds.
name: Publish benchmark image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build
        required: false
        default: main
      tag:
        description: Image tag to publish
        required: false
        default: dev

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Built here rather than inside the image: Maven caching works, and the jar is bytecode, so
      # the same one serves whatever architecture the image targets.
      - name: Build the benchmark jar
        run: mvn -q -B -Pbenchmark -pl modules/workflow-benchmark -am -DskipTests -Djacoco.skip=true package

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push benchmark image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: modules/workflow-benchmark/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/eventconductor-bench:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
