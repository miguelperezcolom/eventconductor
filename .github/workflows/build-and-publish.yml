# Builds the project, publishes Maven artifacts to Maven Central and pushes
# Docker images to Docker Hub when a release is created.
#
# This file replaces the misspelled buid-and-publish.yml.

name: Build and publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract release version
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # strip leading "v" if present
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set Maven version from release tag
        run: mvn -B versions:set -DnewVersion=${{ env.RELEASE_VERSION }} -DprocessAllModules=true -DgenerateBackupPoms=false --file pom.xml

      - name: Build + run tests + JaCoCo coverage check
        run: mvn -B -ntp verify --file pom.xml

      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -DskipTests -f pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: apps/orchestrator-standalone-app
          file: apps/orchestrator-standalone-app/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:latest

      - name: Build and push forms image
        uses: docker/build-push-action@v6
        with:
          context: apps/forms-standalone-app
          file: apps/forms-standalone-app/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:latest

      - name: Scan orchestrator image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true

      - name: Scan forms image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '0'
          ignore-unfixed: true
