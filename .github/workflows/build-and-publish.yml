# Builds the project, publishes Maven artifacts to Maven Central and pushes
# Docker images to Docker Hub when an ENGINE release is created.
#
# This file replaces the misspelled buid-and-publish.yml.

name: Build and publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    # Engine releases only. The version comes from the tag, so a release tagged anything else gets
    # published under that name: the IDE plugins are released from this repository as
    # `plugins-v0.1.x`, and each of those put a full set of engine artifacts on Maven Central
    # under the version "plugins-v0.1.x" — three of them, before anyone noticed. Central is
    # immutable, so they are still there. An engine tag is `v<version>`; nothing else builds.
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Extract release version
        env:
          # Through the environment, not interpolated into the script: a tag name is attacker-shaped input.
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$RELEASE_TAG"
          # strip leading "v" if present
          echo "RELEASE_VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Check the Helm chart's appVersion matches the release
        run: |
          APP_VERSION=$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' charts/eventconductor/Chart.yaml)
          [ "$APP_VERSION" = "$RELEASE_VERSION" ] || { echo "::error file=charts/eventconductor/Chart.yaml::appVersion is '$APP_VERSION' but this release is '$RELEASE_VERSION'. Bump appVersion (and the chart version) in charts/eventconductor/Chart.yaml before releasing."; exit 1; }

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 21
          distribution: zulu
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Pin Maven 3.9
        # The runner image ships Maven 3.10, whose resolver writes maven-metadata-local.xml,
        # _remote.repositories and .locks into central-publishing's staging directory; Central then
        # rejects the bundle ("Bundle has content that does NOT have a .pom file"), as v2.24.0 did.
        # See apache/maven#13388. Drop this once central-publishing-maven-plugin strips those files.
        run: |
          MAVEN_VERSION=3.9.11
          curl -fsSL "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/apache-maven-${MAVEN_VERSION}-bin.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-${MAVEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Show Maven version
        run: mvn -v

      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6.3.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Set Maven version from release tag
        # Also bump the ec.version property, which the generated-worker parents (task-module-parent /
        # task-service-parent) hand downstream as the engine version to build against: versions:set
        # bumps module versions but not properties, so without this the published parents would point
        # at a stale engine and the in-repo example would not resolve the plugin at the release version.
        run: |
          mvn -B versions:set -DnewVersion=${{ env.RELEASE_VERSION }} -DprocessAllModules=true -DgenerateBackupPoms=false --file pom.xml
          mvn -B versions:set-property -Dproperty=ec.version -DnewVersion=${{ env.RELEASE_VERSION }} -DprocessAllModules=true -DgenerateBackupPoms=false --file pom.xml

      - name: Build + run tests + JaCoCo coverage check
        run: mvn -B -ntp verify --file pom.xml

      - name: Publish to Maven Central
        run: mvn -B -ntp deploy -P release -DskipTests -f pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build orchestrator image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/orchestrator-standalone-app
          file: apps/orchestrator-standalone-app/Dockerfile.ci
          # Loaded into the runner's docker daemon, not pushed: the scans below are
          # the gate, and a gate that runs after publication is a report.
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:latest

      - name: Build forms image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/forms-standalone-app
          file: apps/forms-standalone-app/Dockerfile.ci
          # Loaded into the runner's docker daemon, not pushed: the scans below are
          # the gate, and a gate that runs after publication is a report.
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:latest

      - name: Build rules image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/rule-standalone-app
          file: apps/rule-standalone-app/Dockerfile.ci
          # Loaded into the runner's docker daemon, not pushed: the scans below are
          # the gate, and a gate that runs after publication is a report.
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rule-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rule-standalone-app:latest

      - name: Build projector image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/projector-standalone-app
          file: apps/projector-standalone-app/Dockerfile.ci
          # Loaded into the runner's docker daemon, not pushed: the scans below are
          # the gate, and a gate that runs after publication is a report.
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/projector-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/projector-standalone-app:latest

      # The test worker. Published from here for the first time: its image had only ever been
      # pushed by hand from a laptop, from a Dockerfile whose builder stage could not resolve the
      # project's own SNAPSHOT modules and whose COPY named a jar that is not the artifact. Nothing
      # recorded which commit any published image came from.
      - name: Build worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/worker-standalone-app
          file: apps/worker-standalone-app/Dockerfile.ci
          # Loaded into the runner's docker daemon, not pushed: the scans below are
          # the gate, and a gate that runs after publication is a report.
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/worker-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/worker-standalone-app:latest

      # The HTTP egress worker: serves HTTP_CALL steps from the http-calls topic.
      - name: Build http-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/http-worker-standalone-app
          file: apps/http-worker-standalone-app/Dockerfile.ci
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/http-worker-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/http-worker-standalone-app:latest

      # The model egress worker: serves LLM_CALL steps from the llm-calls topic.
      - name: Build llm-worker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/llm-worker-standalone-app
          file: apps/llm-worker-standalone-app/Dockerfile.ci
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-worker-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/llm-worker-standalone-app:latest

      # Webhooks in: verifies each sender's signature and publishes the delivery as a CloudEvent.
      - name: Build webhook-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/webhook-gateway-standalone-app
          file: apps/webhook-gateway-standalone-app/Dockerfile.ci
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-gateway-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/webhook-gateway-standalone-app:latest

      - name: Scan orchestrator image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan forms image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan rules image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/rule-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/worker-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan http-worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/http-worker-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan llm-worker image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/llm-worker-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan webhook-gateway image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/webhook-gateway-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Scan projector image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/projector-standalone-app:${{ env.RELEASE_VERSION }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Every image is pushed here, and only here, once all seven have passed the scan.
      #
      # They used to be pushed as they were built, with the scans afterwards. That made the gate a
      # report: v2.2.0 published five images and *then* failed on the worker's 4 CRITICAL CVEs, so
      # the bad image was on Docker Hub under both its version tag and `latest`, and the projector's
      # scan never ran at all because the failure skipped it. Undoing that took another release.
      #
      # One step rather than five, because a failure part-way through five push steps would leave
      # exactly the half-published state this ordering exists to prevent — and because `latest`
      # moving for some images and not others is worse than it not moving at all.
      - name: Push the images, now that every one of them is clean
        run: |
          for app in orchestrator forms rule projector worker http-worker llm-worker webhook-gateway; do
            image="${{ secrets.DOCKERHUB_USERNAME }}/${app}-standalone-app"
            docker push "${image}:${{ env.RELEASE_VERSION }}"
            docker push "${image}:latest"
          done
