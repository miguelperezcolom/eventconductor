# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java#apache-maven-with-a-settings-path

name: Build and publish

on:
  release:
    types: [published]

jobs:
  all:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set env
        run: VERSION=${{ github.event.release.tag_name }}; echo "RELEASE_VERSION=${VERSION:1}" >> $GITHUB_ENV
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: zulu
          server-id: central # Value of the distributionManagement/repository/id field of the pom.xml
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
      - name: Import GPG Key
        uses: crazy-max/ghaction-import-gpg@v1
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - uses: actions/setup-node@v3
        with:
          node-version: 24

      - name: fix version
        run: mvn versions:set -DnewVersion=${{ env.RELEASE_VERSION }} -DprocessAllModules=true -DgenerateBackupPoms=false --file pom.xml

      - name: Build
        run: mvn -Dmaven.test.skip -B install --file pom.xml

      - name: Publish to Maven Central
        run: mvn -Dmaven.test.skip deploy -f pom.xml
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: apps/orchestrator-standalone-app
          file: apps/orchestrator-standalone-app/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/orchestrator-standalone-app:latest

      - name: Build and push forms image
        uses: docker/build-push-action@v6
        with:
          context: apps/forms-standalone-app
          file: apps/forms-standalone-app/Dockerfile.ci
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:${{ env.RELEASE_VERSION }}
            ${{ secrets.DOCKERHUB_USERNAME }}/forms-standalone-app:latest
