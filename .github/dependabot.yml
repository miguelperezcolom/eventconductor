version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # The protoc that generates the rule engine's gRPC stubs follows the protobuf-java the
      # Spring Boot BOM manages, never past it — stubs generated by a newer protoc refuse to load on
      # the older runtime, and the rule app does not start (2.26.0, 2.27.0). Raised by hand with Boot.
      - dependency-name: "com.google.protobuf:protobuf-java"
      - dependency-name: "com.google.protobuf:protoc"
      # Maven 3.10 is a deliberate move for the whole repository, not a bump: it changes classpath
      # ordering (breadth-first), CI builds with 3.9, and compiling the Maven plugin against a
      # newer API used to raise the Maven its users need. Lift these when the repository moves.
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-plugin-api"
        versions: [">= 3.10.0"]
      - dependency-name: "org.apache.maven:maven-core"
        versions: [">= 3.10.0"]
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
      spring-cloud:
        patterns:
          - "org.springframework.cloud:*"
      spring-ai:
        patterns:
          - "org.springframework.ai:*"
      testing:
        patterns:
          - "org.junit*:*"
          - "org.mockito:*"
          - "org.assertj:*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  # The apps' images, all of them in one PR. The JRE line is chosen by hand, not by Dependabot:
  # the images run on the current LTS that Spring Boot supports (eclipse-temurin 25), and a major
  # bump proposes a non-LTS JDK (26 went out of support six months after it came, 27 is past what
  # Spring Boot 4.1 supports). Minor/patch updates of the same line still come through.
  - package-ecosystem: docker
    directories:
      - "/apps/*"
    schedule:
      interval: weekly
    groups:
      app-images:
        patterns:
          - "*"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
      - dependency-name: "maven"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/doc"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
