spring.application.name=video-series
server.port=8096

# --- The engine ------------------------------------------------------------------------------
workflow.mode=embedded
# jpa, not memory: the console reads the engine's tables. H2 in memory by default (a clean slate on every
# restart); SERIES_DB_URL=jdbc:h2:file:./target/series-db keeps the history across restarts.
workflow.persistence=jpa
spring.datasource.url=${SERIES_DB_URL:jdbc:h2:mem:series;DB_CLOSE_DELAY=-1}
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
# Business dates ("3 days before check-in, at 09:00") are read in the hotel's zone unless a step names one.
workflow.time.zone=Europe/Madrid
# Workers on a pool of their own, not on the outbox relay thread: tasks of one process run at the same time, so
# the airport-transfer race is a real race (and a slow stand-in never holds every other process back).
workflow.embedded.worker-threads=4
# Short retry backoff, so a failing call becomes an incident in seconds (the seed relies on it).
workflow.retry.backoff-base-ms=500
workflow.retry.backoff-max-ms=2000

# --- Laptop only: no Spring Security ----------------------------------------------------------
# Since 2.27/2.28 the REST API, the console and MCP refuse anonymous callers. This lets a laptop
# use them without a login. NEVER in anything reachable from a network.
workflow.message-api.allow-anonymous=true

# --- The forms engine (chapter 7) -------------------------------------------------------------
# The approval form is read from forms/ at startup (forms are not read from the classpath).
forms.directory-import.directories[0]=forms
# Laptop only: who calls the forms API and the forms console is read from the bearer token as it comes,
# unverified, as if a gateway had verified it. Lets a laptop act as "a manager" with no login server.
# NEVER in anything reachable from a network.
workflow.security.trust-forwarded-token=true

# --- Local stand-ins, called over HTTP (named connections: the definitions say `connection: hotel`) ----
workflow.http.connections.hotel.base-url=http://localhost:${server.port}/fake/hotel
workflow.http.connections.hotel.read-timeout=PT5S
workflow.http.connections.channel-manager.base-url=http://localhost:${server.port}/fake/channel-manager
workflow.http.connections.channel-manager.read-timeout=PT5S
workflow.http.connections.taxis.base-url=http://localhost:${server.port}/fake/taxis
workflow.http.connections.taxis.read-timeout=PT10S

# --- Domain events (chapter 9) ----------------------------------------------------------------
# Logical destinations. Embedded, an event published by PUBLISH_EVENT goes to the ExternalEventPublisher
# (here: the default Spring event, which fakes/PublishedEvents records for GET /fake/events) and back to this
# engine's own triggers (workflow.events.loopback, default true).
workflow.events.destinations.bookings.topic=bookings
workflow.events.destinations.guest-events.topic=guest-events

# --- The generic webhook (chapter 9): POST /webhooks/channel-manager -----------------------------
# The webhook gateway, embedded: it checks the HMAC-SHA256 signature of the body (X-Signature-256), turns the
# delivery into a CloudEvent with a fixed type and hands it to this engine's POST /workflow/api/events/bookings.
workflow.webhooks.transport=rest
workflow.webhooks.engine.url=http://localhost:${server.port}
workflow.webhooks.endpoints.channel-manager.provider=generic
workflow.webhooks.endpoints.channel-manager.destination=bookings
workflow.webhooks.endpoints.channel-manager.type=com.example.booking.created
# A demo secret (scripts/webhook.sh signs with it). A real one comes from the environment.
workflow.webhooks.endpoints.channel-manager.secret=${CHANNEL_MANAGER_WEBHOOK_SECRET:series-demo-secret}

# --- MCP (chapter 10) -------------------------------------------------------------------------
# The MCP server is opt-in: it is the spring-ai-starter-mcp-server-webmvc dependency. SSE on /sse.
spring.ai.mcp.server.name=eventconductor-video-series

# --- Observability (chapter 14) ---------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.metrics.tags.application=${spring.application.name}
# Tracing is OFF by default (sampling 0.0), as in every EventConductor app. The `observability` profile turns it on.
management.tracing.sampling.probability=${TRACING_SAMPLING:0.0}
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
