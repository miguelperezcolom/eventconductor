# The `observability` profile (chapter 14): what docker-compose.yml's observability profile expects.
#   mvn spring-boot:run -Dspring-boot.run.profiles=observability
# Tracing ON for every process (EventConductor's default is 0.0, off), shipped over OTLP/HTTP to the local
# Jaeger of the compose file. Metrics need nothing: Prometheus scrapes /actuator/prometheus.
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
