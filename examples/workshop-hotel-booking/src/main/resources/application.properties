spring.application.name=hotel-booking
server.port=8095

# --- The engine ------------------------------------------------------------------------------
workflow.mode=embedded
# jpa, not memory: the console reads the engine's tables. H2 in memory keeps the workshop a
# single command with nothing to install (and a clean slate on every restart).
workflow.persistence=jpa
spring.datasource.url=jdbc:h2:mem:hotel;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# --- Workshop only: no Spring Security --------------------------------------------------------
# Since 2.27/2.28 the REST API, the console and MCP refuse anonymous callers. This lets a laptop
# use them without a login. NEVER in anything reachable from a network.
workflow.message-api.allow-anonymous=true

# --- The forms engine (module 6) --------------------------------------------------------------
# The approval form is read from forms/ at startup (forms are not read from the classpath).
forms.directory-import.directories[0]=forms
# Workshop only: who calls the forms API (/forms/api/tasks) is read from the bearer token as it
# comes, unverified — as if a gateway had verified it. Lets a laptop act as "a manager" with no
# login server. NEVER in anything reachable from a network.
workflow.security.trust-forwarded-token=true

# --- The hotel's API (module 4) ---------------------------------------------------------------
# A named connection: definitions say `connection: hotel`, the base URL (and any credentials)
# stay here. In the workshop it is the fake hotel this app serves itself.
workflow.http.connections.hotel.base-url=http://localhost:${server.port}/fake/hotel
workflow.http.connections.hotel.read-timeout=PT5S

# --- The language model (module 5) ------------------------------------------------------------
# provider=openai talks to OpenAI or any OpenAI-compatible server. Here: the fake model this app
# serves itself, so the workshop needs no key and sends nothing anywhere. For a real provider,
# set base-url/model and take the key from the environment, e.g.
#   workflow.llm.connections.assistant.provider=anthropic
#   workflow.llm.connections.assistant.model=claude-sonnet-5-5
#   workflow.llm.connections.assistant.api-key=${ANTHROPIC_API_KEY}
workflow.llm.connections.assistant.provider=openai
workflow.llm.connections.assistant.base-url=http://localhost:${server.port}/fake/llm
workflow.llm.connections.assistant.model=fake-model
workflow.llm.connections.assistant.api-key=not-a-real-key
