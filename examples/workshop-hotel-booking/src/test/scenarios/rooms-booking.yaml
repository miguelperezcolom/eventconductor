# Scenarios as data: test cases anyone can add without writing Java. ScenariosTest runs every
# scenario in this directory, each as a test of its own.
#
# The file's settings are shared by its scenarios; a scenario adds to them or overrides them.
steps:
  register-booking: { complete: { bookingNumber: BK-1 } }
  create-room-booking:                    # the first answer whose `when` holds, over what the task was sent
    - { when: "room.type == 'penthouse'", fail: SOLD_OUT, retryable: false }
    - { complete: { roomBookingId: "RB-${room.number}" } }
  cancel-room-booking: { complete: {} }
  ask-guest: { complete: {} }
  tell-front-desk: { complete: {} }
  notify-guest: { complete: {} }

scenarios:
  - name: every room is booked and the guest is told
    workflow: rooms-booking
    variables:
      guest: Alice
      rooms: [ { number: "101", type: double }, { number: "102", type: double } ]
    expect:
      status: COMPLETED
      passedSteps: [register-booking, rooms, notify-guest]
      variables:
        bookingNumber: BK-1
        roomBookings: [RB-101, RB-102]
      invocations: { notify-guest: 1 }

  - name: a sold-out penthouse keeps the rooms that were booked and asks the guest
    workflow: rooms-booking-safe
    variables:
      guest: Bob
      rooms: [ { number: "101", type: double }, { number: "900", type: penthouse } ]
    expect:
      status: RUNNING
      waitingAt: wait-for-guest
      passedSteps: [register-booking, rooms, ask-guest]
      notPassedSteps: [cancel-room-booking, notify-guest]

  - name: the guest cancels, so the room that was booked is cancelled
    workflow: rooms-booking-safe
    variables:
      guest: Bob
      rooms: [ { number: "101", type: double }, { number: "900", type: penthouse } ]
    then:
      - sendMessage: { name: guest-answer, variables: { answer: cancel } }
    expect:
      status: COMPENSATED
      passedSteps: [ask-guest, wait-for-guest, cancelled-by-guest, cancel-room-booking]
      notPassedSteps: [notify-guest]
      invocations: { cancel-room-booking: 1 }

  - name: the guest keeps the rooms that were booked
    workflow: rooms-booking-safe
    variables:
      guest: Bob
      rooms: [ { number: "101", type: double }, { number: "900", type: penthouse } ]
    then:
      - sendMessage: { name: guest-answer, variables: { answer: keep } }
    expect:
      status: COMPLETED
      passedSteps: [wait-for-guest, guest-decision, done]
      notPassedSteps: [cancelled-by-guest, cancel-room-booking, notify-guest]

  - name: a guest who never answers is not cancelled — the front desk follows up
    workflow: rooms-booking-safe
    variables:
      guest: Bob
      rooms: [ { number: "101", type: double }, { number: "900", type: penthouse } ]
    then:
      - advanceTime: P2DT1M
    expect:
      status: COMPLETED
      passedSteps: [tell-front-desk, held]
      notPassedSteps: [cancel-room-booking, notify-guest]

  - name: a safe booking with every room available is booked and the guest told
    workflow: rooms-booking-safe
    variables:
      guest: Dora
      rooms: [ { number: "101", type: double } ]
    expect:
      status: COMPLETED
      passedSteps: [rooms, notify-guest]
      notPassedSteps: [ask-guest, cancel-room-booking]

  - name: a penthouse the hotel never confirms is retried, then the guest is asked
    workflow: rooms-booking-safe
    variables:
      guest: Carol
      rooms: [ { number: "101", type: double }, { number: "900", type: penthouse } ]
    steps:
      create-room-booking:
        - { when: "room.type == 'penthouse'", timeout: true }   # 30 s timeout, retried twice
        - { complete: { roomBookingId: "RB-${room.number}" } }
    then:
      - advanceTime: PT10M
    expect:
      status: RUNNING
      waitingAt: wait-for-guest
      passedSteps: [ask-guest]
      notPassedSteps: [cancel-room-booking]

  - name: the first booking is registered
    workflow: first-booking
    expect:
      status: COMPLETED
      variables: { bookingNumber: BK-1 }

  - name: the hotel refuses the second room and offers another; the guest cancels, so the first is cancelled over HTTP
    workflow: rooms-booking-http
    variables:
      rooms: [ { number: "101", type: double }, { number: "102", type: double } ]
    http:
      rooms:                              # in order: the first call books, every later one is refused
        - { status: 201, body: { id: H-1 } }
        - { status: 409, body: { error: sold out } }
      find-alternatives: { status: 200, body: [ { number: "103", type: suite, instead: "102" } ] }
      cancel-room: { status: 204 }
    then:
      - sendMessage: { name: guest-answer, variables: { answer: cancel } }
    expect:
      status: COMPENSATED
      passedSteps: [find-alternatives, ask-guest, cancelled-by-guest, cancel-room]
      invocations: { cancel-room: 1 }

  - name: the guest accepts the alternative the hotel offered
    workflow: rooms-booking-http
    variables:
      rooms: [ { number: "101", type: double }, { number: "102", type: double } ]
    http:
      rooms:
        - { status: 201, body: { id: H-1 } }
        - { status: 409, body: { error: sold out } }
      find-alternatives: { status: 200, body: [ { number: "103", type: suite, instead: "102" } ] }
      book-alternatives: { status: 201, body: { id: H-2 } }
    then:
      - sendMessage: { name: guest-answer, variables: { answer: accept } }
    expect:
      status: COMPLETED
      passedSteps: [book-alternatives, booked-with-alternatives]
      notPassedSteps: [cancel-room]
      variables: { alternativeBookings: [H-2] }

  - name: the guest keeps the room that was booked
    workflow: rooms-booking-http
    variables:
      rooms: [ { number: "101", type: double }, { number: "102", type: double } ]
    http:
      rooms:
        - { status: 201, body: { id: H-1 } }
        - { status: 409, body: { error: sold out } }
      find-alternatives: { status: 200, body: [ { number: "103", type: suite, instead: "102" } ] }
    then:
      - sendMessage: { name: guest-answer, variables: { answer: keep } }
    expect:
      status: COMPLETED
      passedSteps: [kept]
      notPassedSteps: [book-alternatives, cancel-room]
