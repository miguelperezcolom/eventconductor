# Test-only variant of module 3: the same rooms with onIterationFailure: compensateAll — all rooms or
# none, decided by the engine on its own. Right when the rooms are one technical unit that is worth
# nothing in part (a tour operator's package, sold whole); not when there is a guest to ask.
id: rooms-booking-all-or-none
name: Book every room (all or none)
steps:
  - id: start
    type: START
    name: Booking received
  - id: rooms
    type: PROCESS
    name: Book every room
    preconditionStepId: start
    compensable: true
    compensationStepId: cancel-room-booking
    outputVariables: [roomBookingId]
    forEach:
      items: rooms
      as: room
      label: "'Room ' + room.number"
      onIterationFailure: compensateAll      # wait for every room; if one failed, undo the rest
      output: roomBookings
      outputElement: roomBookingId
    steps:
      - id: start
        type: START
        name: Start
      - id: create-room-booking
        type: ACTION
        name: Book the room
        preconditionStepId: start
      - id: end
        type: END
        name: End
        preconditionStepId: create-room-booking
  - id: done
    type: END
    name: Done
    preconditionStepId: rooms
  - id: cancel-room-booking
    type: ACTION
    name: Cancel the room
