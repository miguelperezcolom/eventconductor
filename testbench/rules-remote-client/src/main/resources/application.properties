spring.application.name=rules-remote-client

# Fetch rules from a remote catalog over gRPC (start the catalog with RULES_GRPC_ENABLED=true: it is off by default)
# (switch to rest + rules.catalog.url for HTTP)
rules.source=grpc
rules.catalog.grpc-target=localhost:9090
#rules.source=rest
#rules.catalog.url=http://localhost:8991
rules.cache.ttl=PT5M
