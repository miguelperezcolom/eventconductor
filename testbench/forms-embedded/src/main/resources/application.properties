spring.application.name=forms-embedded

server.port=8091

# jpa, not memory: the forms UI reads the JPA entity repositories directly (the forms and tasks
# lists), so it only runs on this side. H2 in memory keeps it a single command with nothing to
# install.
forms.persistence=jpa

spring.datasource.url=jdbc:h2:mem:forms;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Development testbench without Spring Security: since 2.27.0 the engine API, and since 2.28.0 the
# admin UI, MCP and rule-read endpoints, refuse anonymous requests unless this is set. Never in production.
workflow.message-api.allow-anonymous=true
