spring.application.name=embedded

server.port=8095

workflow.mode=embedded
# jpa, not memory: the engine's UI reads the JPA entity repositories directly (the home
# dashboard's counts, the process detail's steps/messages/errors/resources), so it only runs
# on this side. H2 in memory keeps it a single command with nothing to install.
workflow.persistence=jpa

spring.datasource.url=jdbc:h2:mem:workflow;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Something to look at: the workflows/ folder holds a saga that fails and rolls back, and one
# that sits in a TIMER for a while, both started by cron. Turn this off to keep the list still.
workflow.cron-enabled=true
workflow.cron-scan-interval-ms=5000
