# Infrastructure for the benchmark. Deliberately separate from the harness: the point of this
# module is that you decide where PostgreSQL and Kafka run, and everything below is only the
# convenient case — all of it on one machine, which is fine for comparing two builds and is not
# a basis for any claim about scale.
#
#   docker compose -f modules/workflow-benchmark/docker-compose.yml up -d
#
# To measure something quotable, run these on their own hosts and point the harness at them with
# -Dbench.jdbc.url / -Dbench.kafka.brokers.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: eventconductor
      POSTGRES_USER: eventconductor
      POSTGRES_PASSWORD: eventconductor
    # Not 5432: the point is to never collide with a PostgreSQL you already run.
    ports: ["55432:5432"]
    # Defaults are tuned for a small shared box, which makes a benchmark measure the defaults.
    # These are ordinary production-ish values, not tricks: enough shared buffers to keep the
    # working set in memory and a WAL that is not flushed synchronously on every commit.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - max_connections=300
      - -c
      - synchronous_commit=off
      - -c
      - wal_writer_delay=200ms
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventconductor"]
      interval: 2s
      timeout: 3s
      retries: 30

  kafka:
    image: apache/kafka:3.9.0
    # Likewise not 9092.
    ports: ["59092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:59092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Partitions bound how many pods can share the work; six is enough for the pod counts this
      # harness is usually run with, and raising it is a knob worth sweeping.
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: benchmark-cluster-00001
