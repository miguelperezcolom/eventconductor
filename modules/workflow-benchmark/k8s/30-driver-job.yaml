# The measurement. A Job, not a Deployment: it runs once, prints the report, and is done.
#
# Shares a node with nothing else that matters — it publishes and reads timestamps, and the metric
# it computes comes from the database, so its own CPU does not enter the figure. It still gets its
# own node, because a driver competing with a pod for cores would distort the arrival rate it is
# supposed to be holding steady — and the request is sized above the spare capacity of the
# existing nodes so it cannot land on one of them either.
apiVersion: batch/v1
kind: Job
metadata:
  name: driver
  namespace: ec-bench
spec:
  # Retries, because a driver that lands on a freshly provisioned node can start before CoreDNS
  # is reachable there and die resolving the database. That is the cluster warming up, not a
  # failed measurement.
  backoffLimit: 3
  template:
    metadata:
      labels: { app: driver, bench-role: driver, bench-node-exclusive: "true" }
    spec:
      restartPolicy: Never
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions: [{ key: bench-node-exclusive, operator: Exists }]
              topologyKey: kubernetes.io/hostname
      # The benchmark image is private; the secret is created by the runbook.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: driver
          image: BENCH_IMAGE
          env:
            - name: BENCH_OPTS
              value: >-
                -Dbench.role=drive
                -Dbench.processes=2000
                -Dbench.rate=40
                -Dbench.jdbc.url=jdbc:postgresql://postgres.ec-bench.svc.cluster.local:5432/eventconductor
                -Dbench.kafka.brokers=kafka.ec-bench.svc.cluster.local:9092
                -XX:MaxRAMPercentage=70
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: "1000m", memory: "1Gi" }
      volumes: [{ name: tmp, emptyDir: {} }]
