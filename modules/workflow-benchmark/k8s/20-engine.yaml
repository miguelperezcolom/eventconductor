# The three roles, one per node.
#
# Image tag is a placeholder the runbook substitutes, so a run always states which build it
# measured rather than trusting :latest to be what you think it is.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pods
  namespace: ec-bench
spec:
  replicas: 2
  # Recreate, not rolling: with one role per node and no spare nodes, a rolling update deadlocks —
  # the outgoing pods hold the only nodes their replacements are allowed to use.
  strategy: { type: Recreate }
  selector: { matchLabels: { app: pods } }
  template:
    metadata:
      labels: { app: pods, bench-role: pods, bench-node-exclusive: "true" }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions: [{ key: bench-node-exclusive, operator: Exists }]
              topologyKey: kubernetes.io/hostname
      # The benchmark image is private; the secret is created by the runbook.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: pod
          image: BENCH_IMAGE
          env:
            - name: BENCH_OPTS
              value: >-
                -Dbench.role=pods
                -Dbench.pods=1
                -Dbench.jdbc.url=jdbc:postgresql://postgres.ec-bench.svc.cluster.local:5432/eventconductor
                -Dbench.kafka.brokers=kafka.ec-bench.svc.cluster.local:9092
                -Dbench.consumer.concurrency=3
                -Dbench.pool-size=20
                -XX:MaxRAMPercentage=70
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: "1500m", memory: "1500Mi" }
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ec-bench
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: worker } }
  template:
    metadata:
      labels: { app: worker, bench-role: worker, bench-node-exclusive: "true" }
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions: [{ key: bench-node-exclusive, operator: Exists }]
              topologyKey: kubernetes.io/hostname
      # The benchmark image is private; the secret is created by the runbook.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      imagePullSecrets: [{ name: regcred }]
      containers:
        - name: worker
          image: BENCH_IMAGE
          env:
            - name: BENCH_OPTS
              value: >-
                -Dbench.role=worker
                -Dbench.worker.concurrency=16
                -Dbench.worker.think-ms=0
                -Dbench.kafka.brokers=kafka.ec-bench.svc.cluster.local:9092
                -XX:MaxRAMPercentage=70
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: "1000m", memory: "1Gi" }
      volumes: [{ name: tmp, emptyDir: {} }]
