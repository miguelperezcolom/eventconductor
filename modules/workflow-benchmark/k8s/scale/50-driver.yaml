# The load driver — benchmark image, soak role, scale workload.
#
# A Deployment, not a Job: it drives until stopped (bench.soak.minutes=0) so the chaos loop can run
# under sustained load for as long as the run needs; the controller scales it to 0 to stop the load
# before the drain-and-verify. It installs the whole definition suite, tags a configured fraction of
# processes to roll back / fail their compensation, and writes the acked count to soak_progress
# every second (acks=all + idempotent, so a killed driver's count survives — the conservation
# contract the verifier reads).
#
# SOAK_PREFIX and SOAK_RATE are placeholders the controller substitutes per run. Pick SOAK_RATE from
# the pilot's measured ceiling (rung 2); above it the attempted-vs-acked gap just grows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver
  namespace: ec-scale
spec:
  replicas: 1
  selector: { matchLabels: { app: driver } }
  template:
    metadata:
      labels: { app: driver, scale-role: driver }
    spec:
      imagePullSecrets: [{ name: regcred }]
      # A grace period long enough for the shutdown hook to flush the final acked count.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsUser: 1000, runAsGroup: 1000 }
      containers:
        - name: driver
          image: BENCH_IMAGE
          env:
            - name: BENCH_OPTS
              value: >-
                -Dbench.role=soak
                -Dbench.workload=scale
                -Dbench.soak.prefix=SOAK_PREFIX
                -Dbench.rate=SOAK_RATE
                -Dbench.scale.saga-weight-pct=40
                -Dbench.scale.comp-permil=100
                -Dbench.scale.comp-fail-permil=10
                -Dbench.jdbc.url=jdbc:postgresql://postgres.ec-scale.svc.cluster.local:5432/eventconductor
                -Dbench.kafka.brokers=kafka-bootstrap.ec-scale.svc.cluster.local:9092
                -XX:MaxRAMPercentage=70
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
            readOnlyRootFilesystem: true
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources:
            requests: { cpu: "1", memory: "1Gi" }
            limits: { memory: "1500Mi" }
      volumes: [{ name: tmp, emptyDir: {} }]
