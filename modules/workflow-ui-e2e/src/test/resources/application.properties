spring.application.name=workflow-ui-e2e

# The UI is a web application and reads the JPA entity repositories directly, so these tests only
# run on the durable path. H2 is a real database with nothing to install; the engine applies its
# own migrations onto it, so the schema under test is the schema production gets.
workflow.mode=embedded
workflow.persistence=jpa

# PostgreSQL mode because the engine's migrations are written for PostgreSQL, and they are what
# builds this schema — ddl-auto only validates that the entities still match what they built.
spring.datasource.url=jdbc:h2:mem:ui-e2e;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate

# The test worker's tables, which no migration builds — see schema.sql for why they are stated
# there rather than created by ddl-auto.
worker.persistence=jpa

# No broker here. Mateu's annotation processor generates a @ComponentScan over the whole io.mateu
# tree for every @UI class, so the test worker's Kafka binding is pulled into any application that
# mounts a Mateu UI — including this one, which runs embedded mode and therefore has no Cloud
# Stream at all. Switching the binding off is the supported way to embed the worker's pages
# without a broker.
worker.kafka.enabled=false

# Nothing may appear in the UI that a test did not put there. The testbench app leaves cron on so
# there is always something to look at by hand; here it would mean a grid whose row count moves
# under the assertions. The definitions in test resources under workflows/ are the seed, imported
# at startup by the engine's own classpath importer.
workflow.cron-enabled=false

# The detail view polls every 2s while a process is not terminal, so the relay has to be quicker
# than that or a test would be waiting on the poll rather than on the engine.
workflow.outbox-poll-interval-ms=100

logging.level.io.mateu=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# The UI is read-only over the engine repositories; open-in-view keeps a connection per request
# for no gain and drags the EntityManagerFactory into web autoconfiguration.
spring.jpa.open-in-view=false
