workflow.mode=embedded
workflow.persistence=memory

# Scan often so timeout and timer scenarios resolve quickly in tests.
workflow.timeout-scan-interval-ms=200

# Cron starts stay off by default so the cron.json definition does not spawn
# processes in unrelated test contexts; CronStartE2eTest re-enables it.
workflow.cron-enabled=false

spring.main.web-application-type=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.io.mateu.workflow=WARN
