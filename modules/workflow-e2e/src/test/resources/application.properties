workflow.mode=embedded
workflow.persistence=memory

# Scan often so timeout, timer and retry-backoff scenarios resolve quickly in tests.
workflow.timeout-scan-interval-ms=200

# Short, fixed retry backoff so auto-retry scenarios resolve quickly and deterministically:
# a tiny base, no growth and no jitter keep the wait predictable for awaited assertions.
workflow.retry.backoff-base-ms=50
workflow.retry.backoff-multiplier=1.0
workflow.retry.backoff-max-ms=50
workflow.retry.backoff-jitter=0.0

# Cron starts stay off by default so the cron.json definition does not spawn
# processes in unrelated test contexts; CronStartE2eTest re-enables it.
workflow.cron-enabled=false

spring.main.web-application-type=none
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.web.servlet.WebMvcAutoConfiguration,\
  org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

logging.level.io.mateu.workflow=WARN
