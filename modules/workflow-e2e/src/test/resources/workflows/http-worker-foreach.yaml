id: http-worker-foreach
name: A forEach step served by a worker over HTTP
version: 1
steps:
  - { id: start, type: START, name: Start }
  - id: reserve
    type: ACTION
    name: Reserve a room (HTTP worker)
    topic: http-payments
    preconditionStepId: start
    forEach:
      items: rooms
      as: room
      indexAs: roomIndex
      output: reservations
      outputElement: reservationId
  - { id: end, type: END, name: End, preconditionStepId: reserve }
