id: foreach-throttled
name: At most two at a time
version: 1
steps:
  - { id: start, type: START, name: Start }
  - id: call
    type: ACTION
    name: Call
    topic: work
    preconditionStepId: start
    forEach:
      items: "[1, 2, 3, 4, 5]"
      maxConcurrency: 2
  - { id: end, type: END, name: End, preconditionStepId: call }
