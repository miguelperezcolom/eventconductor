id: rooms
name: Reserve every room
version: 1
steps:
  - { id: start, type: START, name: Start }
  - id: reserve
    type: ACTION
    name: Reserve a room
    topic: reserve
    preconditionStepId: start
    forEach:
      items: rooms
      as: room
      output: reservations
      outputElement: reservationId
  - { id: end, type: END, name: End, preconditionStepId: reserve }
