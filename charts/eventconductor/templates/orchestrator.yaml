## ── Orchestrator Deployment ──────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventconductor.fullname" . }}-orchestrator
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  replicas: {{ .Values.orchestrator.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: orchestrator
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: orchestrator
          image: "{{ .Values.orchestrator.image }}:{{ default .Chart.AppVersion .Values.orchestrator.imageTag }}"
          imagePullPolicy: {{ .Values.orchestrator.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.orchestrator.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.orchestrator.port | quote }}
            - name: WORKFLOW_MODE
              value: kafka
            - name: WORKFLOW_PERSISTENCE
              value: jpa
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BROKERS
              value: {{ .Values.redpanda.brokerInternal }}
            - name: DDL_AUTO
              value: {{ .Values.orchestrator.ddlAuto | quote }}
            - name: FLYWAY_ENABLED
              value: {{ .Values.orchestrator.flywayEnabled | quote }}
            # The engine applies its own migrations and records them here. Baselining at 0
            # so V1 is applied even though the schema is not empty — the three apps share
            # one database, so "not empty" means somebody else got here first — is now the
            # engine's own behaviour and no longer needs to be configured per deployment.
            - name: WORKFLOW_SCHEMA_TABLE
              value: {{ .Values.orchestrator.flywayTable | quote }}
            - name: KAFKA_CONCURRENCY
              value: {{ .Values.orchestrator.consumerConcurrency | quote }}
            - name: DB_POOL_SIZE
              value: {{ .Values.orchestrator.dbPoolSize | quote }}
            - name: DEFAULT_STEP_TIMEOUT_MS
              value: {{ .Values.orchestrator.defaultStepTimeoutMs | quote }}
            - name: SECURITY_ENABLED
              value: {{ .Values.orchestrator.security.enabled | quote }}
            - name: SECURITY_USER
              value: {{ .Values.orchestrator.security.user | quote }}
            {{- if .Values.orchestrator.security.passwordSecret }}
            - name: SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orchestrator.security.passwordSecret }}
                  key: SECURITY_PASSWORD
            {{- end }}
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            {{- range $k, $v := .Values.orchestrator.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.orchestrator.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
## ── Orchestrator Service ─────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: orchestrator
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: orchestrator
  ports:
    - port: {{ .Values.orchestrator.servicePort }}
      targetPort: {{ .Values.orchestrator.port }}
{{- if .Values.orchestrator.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eventconductor.fullname" . }}-orchestrator
spec:
  minAvailable: {{ .Values.orchestrator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: orchestrator
{{- end }}
