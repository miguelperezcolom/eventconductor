{{- if include "eventconductor.generateAdminSecret" . }}
{{- $name := printf "%s-admin" (include "eventconductor.fullname" .) | trunc 63 | trimSuffix "-" }}
{{- /* Keep the password across upgrades: reuse the one already in the cluster. (Where lookup
       cannot reach the cluster — helm template, some GitOps tools — a new one is generated on
       every render: set *.security.passwordSecret there.) */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $generated := "" }}
{{- if and $existing $existing.data (hasKey $existing.data "SECURITY_PASSWORD") }}
{{- $generated = index $existing.data "SECURITY_PASSWORD" }}
{{- else }}
{{- $generated = randAlphaNum 32 | b64enc }}
{{- end }}
## ── Admin password (generated) ───────────────────────────────────────────────
## For the apps with security on and no security.passwordSecret. Read it with:
##   kubectl get secret {{ $name }} -o jsonpath='{.data.SECURITY_PASSWORD}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
type: Opaque
data:
  SECURITY_PASSWORD: {{ $generated | quote }}
{{- end }}
