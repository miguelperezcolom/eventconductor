## ── Forms Deployment ─────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventconductor.fullname" . }}-forms
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: forms
spec:
  replicas: {{ .Values.forms.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forms
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: forms
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        - name: wait-for-redpanda
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redpanda 19092; do echo waiting for redpanda; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      containers:
        - name: forms
          image: "{{ .Values.forms.image }}:{{ default .Chart.AppVersion .Values.forms.imageTag }}"
          imagePullPolicy: {{ .Values.forms.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.forms.port }}
          env:
            - name: SERVER_PORT
              value: {{ .Values.forms.port | quote }}
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/{{ .Values.postgres.database }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: KAFKA_BROKERS
              value: {{ .Values.redpanda.brokerInternal }}
            - name: DDL_AUTO
              value: {{ .Values.forms.ddlAuto | quote }}
            - name: FLYWAY_ENABLED
              value: {{ .Values.forms.flywayEnabled | quote }}
            - name: SECURITY_ENABLED
              value: {{ .Values.forms.security.enabled | quote }}
            - name: SECURITY_USER
              value: {{ .Values.forms.security.user | quote }}
            {{- if .Values.forms.security.passwordSecret }}
            - name: SECURITY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.forms.security.passwordSecret }}
                  key: SECURITY_PASSWORD
            {{- end }}
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          resources:
            {{- toYaml .Values.forms.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.forms.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.forms.port }}
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: tmp
          emptyDir: {}
---
## ── Forms Service ────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: forms
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: forms
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: forms
  ports:
    - port: {{ .Values.forms.servicePort }}
      targetPort: {{ .Values.forms.port }}
{{- if .Values.forms.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eventconductor.fullname" . }}-forms
spec:
  minAvailable: {{ .Values.forms.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: forms
{{- end }}
