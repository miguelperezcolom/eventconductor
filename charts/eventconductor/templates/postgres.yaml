{{- if not .Values.postgres.existingSecret }}
{{- if not .Values.postgres.password }}
{{- fail "postgres.password must be set, or postgres.existingSecret must point to an existing Secret with POSTGRES_* keys" }}
{{- end }}
## ── PostgreSQL Secret ────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eventconductor.fullname" . }}-postgres
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
---
{{- end }}
## ── PostgreSQL PVC ───────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "eventconductor.fullname" . }}-postgres
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
  {{- if .Values.postgres.storageClass }}
  storageClassName: {{ .Values.postgres.storageClass }}
  {{- end }}
---
## ── PostgreSQL Deployment ────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eventconductor.fullname" . }}-postgres
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  # Single RWO volume — never run two pods at once (avoids multi-attach deadlock).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: postgres
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          # "postgres" first because args replaces the image's CMD, not just appends to it.
          args: ["postgres", "-c", "max_connections={{ .Values.postgres.maxConnections }}"]
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: 5432
          env:
            # Use a subdirectory, not the volume mount root (which holds lost+found
            # on ext4 block volumes and cannot be used directly as PGDATA).
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ default (printf "%s-postgres" (include "eventconductor.fullname" .)) .Values.postgres.existingSecret }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.username | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "eventconductor.fullname" . }}-postgres
---
## ── PostgreSQL Service ───────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "eventconductor.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - port: 5432
      targetPort: 5432
