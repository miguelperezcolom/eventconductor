  port: 8080
  servicePort: 8106
  ddlAuto: validate
  flywayEnabled: true
  # Flyway's history table. The three apps are normally pointed at one database and each
  # carries its own migrations numbered from V1, so they cannot share one history table:
  # whichever starts first writes its V1 there and the others fail validation on a checksum
  # mismatch. The engine keeps the default name; forms and rules take suffixed ones.
  flywayTable: flyway_schema_history_forms
  security:
    enabled: true
    user: admin
    passwordSecret: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
