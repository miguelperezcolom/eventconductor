## ── PostgreSQL ───────────────────────────────────────────────────────────────
postgres:
  image: postgres:16
  database: workflow
  username: workflow
  # Leave empty in version control. Override with --set or values-prod.yaml,
  # or set existingSecret to point to a pre-provisioned Secret with the keys
  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD.
  password: ""
  existingSecret: ""
  port: 5432
  storage: 8Gi
  storageClass: ""

## ── Redpanda ─────────────────────────────────────────────────────────────────
redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
  brokerInternal: redpanda:19092
  externalNodePort: 30092
  storage: 8Gi
  storageClass: ""

## ── Orchestrator ─────────────────────────────────────────────────────────────
orchestrator:
  image: miguelperezcolom/orchestrator-standalone-app
  imageTag: ""              # defaults to .Chart.AppVersion when blank
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  servicePort: 8105
  # In production keep ddl-auto=validate so Flyway owns the schema.
  ddlAuto: validate
  flywayEnabled: true
  security:
    enabled: true
    user: admin
    # Name of an existing Secret with key SECURITY_PASSWORD. If blank a random
    # password is generated at start-up and logged.
    passwordSecret: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

## ── Forms ────────────────────────────────────────────────────────────────────
forms:
  image: miguelperezcolom/forms-standalone-app
  imageTag: ""
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  servicePort: 8106
  ddlAuto: validate
  flywayEnabled: true
  security:
    enabled: true
    user: admin
    passwordSecret: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

## ── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: eventconductor.local
  orchestratorPath: /orchestrator
  formsPath: /forms
  tls: []                     # [{ secretName: ec-tls, hosts: [eventconductor.local] }]

## ── NetworkPolicy ────────────────────────────────────────────────────────────
networkPolicy:
  enabled: false
  # Pod selector for clients allowed to talk to orchestrator/forms.
  # Empty means "only same-namespace pods".
  ingressFromPodSelector: {}
