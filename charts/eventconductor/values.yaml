## ── PostgreSQL ───────────────────────────────────────────────────────────────
postgres:
  image: postgres:16
  database: workflow
  username: workflow
  # Leave empty in version control. Override with --set or values-prod.yaml,
  # or set existingSecret to point to a pre-provisioned Secret with the keys
  # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD.
  password: ""
  existingSecret: ""
  # PostgreSQL's own default is 100, and this chart's defaults ask for 96 of them before anything
  # else connects: three apps at dbPoolSize 16, two replicas each. The database is then full, and
  # the next thing to open a connection — an application of yours sharing it, a psql session, the
  # backup you are about to take — is refused with "sorry, too many clients already". Keep this
  # above (orchestrator + forms + rules pool sizes x their replicas) plus room for your own
  # clients. Raising it costs a few MB of server memory per additional connection.
  maxConnections: 200
  port: 5432
  storage: 8Gi
  storageClass: ""
  # Not a sizing hint — a pod with no requests is BestEffort, and BestEffort is what the kubelet
  # evicts first when a node runs short of memory. Left empty, the database and the broker are
  # the two pods most likely to be killed to make room for another stateless replica of the
  # thing that depends on them. Observed on a test cluster: scaling the orchestrator from 3 to 6
  # evicted the broker, and the engine stopped completely.
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "2Gi"

## ── Redpanda ─────────────────────────────────────────────────────────────────
redpanda:
  image: docker.redpanda.com/redpandadata/redpanda:v24.1.7
  # Topics are auto-created, and Redpanda's own default is a single partition — which would make
  # extra orchestrator replicas pure failover: one partition can only ever have one consumer, so
  # the others would idle. The engine keys every event by process, so partitions are what spread
  # the work. Keep this at or above the number of orchestrator replicas you intend to run.
  defaultTopicPartitions: 6
  # Shard count, pinned. Left to Redpanda it is taken from the cores it can see, and it is then
  # written into the data directory as an invariant: a broker that comes back on a smaller node
  # refuses to start at all — "Decreasing redpanda core count is not allowed" — and stays down
  # until somebody notices. On any cluster with a node autoprovisioner, or simply with mixed
  # instance types, that turns an ordinary reschedule into a full outage of the engine. Pinning
  # it makes the broker portable across node sizes. Raise it deliberately, never implicitly, and
  # never lower it on a broker that already has data.
  cores: 2
  brokerInternal: redpanda:19092
  externalNodePort: 30092
  storage: 8Gi
  storageClass: ""
  # See the note on postgres.resources: without requests this pod is BestEffort and is evicted
  # before any orchestrator replica. Redpanda's own footprint is well over a gigabyte at rest.
  resources:
    requests:
      memory: "2Gi"
      cpu: "500m"
    limits:
      memory: "3Gi"

## ── Orchestrator ─────────────────────────────────────────────────────────────
orchestrator:
  image: miguelperezcolom/orchestrator-standalone-app
  imageTag: ""              # defaults to .Chart.AppVersion when blank
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  servicePort: 8105
  # In production keep ddl-auto=validate so Flyway owns the schema.
  ddlAuto: validate
  flywayEnabled: true
  # Flyway's history table. The three apps are normally pointed at one database and each
  # carries its own migrations numbered from V1, so they cannot share one history table:
  # whichever starts first writes its V1 there and the others fail validation on a checksum
  # mismatch. The engine keeps the default name; forms and rules take suffixed ones.
  flywayTable: flyway_schema_history
  # Consumer threads per pod, on each of the two consumer bindings. The useful ceiling is
  # redpanda.defaultTopicPartitions / replicas — threads past the partition count are assigned
  # nothing. Below that ceiling a deployment cannot use the partitions it created: measured on a
  # three-pod cluster with six partitions, one thread per pod left four of them unconsumed while
  # no pod was near CPU-bound.
  consumerConcurrency: 3
  # Must exceed 2 x consumerConcurrency plus the relay, the timeout scanner and the UI. The total
  # across replicas also has to fit PostgreSQL's max_connections (100 by default): at these
  # defaults that is 16 x replicas.
  dbPoolSize: 16
  # Fallback timeout, in milliseconds, for ACTION and RULE steps whose definition declares none.
  # 0 leaves them with no deadline at all, which is the default and is riskier than it sounds: the
  # timeout scan is an index range over the deadline, so a step without one is never looked at
  # again. If its dispatch or its worker's reply is lost the process stops permanently, and the
  # only signal is the eventconductor.steps.stalled gauge. Set this above your slowest task and
  # the engine retries those steps by itself.
  defaultStepTimeoutMs: 0
  # Extra environment variables injected verbatim (e.g. git-import config via Spring
  # relaxed binding: WORKFLOW_GITIMPORT_REPOSITORIES_0_URL / _0_BRANCH).
  extraEnv: {}
  security:
    enabled: true
    user: admin
    # Name of an existing Secret with key SECURITY_PASSWORD. If blank a random
    # password is generated at start-up and logged.
    passwordSecret: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

## ── Forms ────────────────────────────────────────────────────────────────────
forms:
  image: miguelperezcolom/forms-standalone-app
  imageTag: ""
  imagePullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  servicePort: 8106
  ddlAuto: validate
  flywayEnabled: true
  # Flyway's history table. The three apps are normally pointed at one database and each
  # carries its own migrations numbered from V1, so they cannot share one history table:
  # whichever starts first writes its V1 there and the others fail validation on a checksum
  # mismatch. The engine keeps the default name; forms and rules take suffixed ones.
  flywayTable: flyway_schema_history_forms
  security:
    enabled: true
    user: admin
    passwordSecret: ""
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1"
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

