{{- if .Values.ingress.enabled }}
{{/*
One host, path-routed. The service named in .Values.ingress.root answers at "/" — it is the UI the
rest of the demo hangs off — and every other service is reachable under /<name>, which is enough to
open a demo up without giving each one a hostname.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "demo.fullname" . }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $name, $svc := .Values.services }}
          {{- if ne $name $.Values.ingress.root }}
          - path: /{{ $name }}
            pathType: Prefix
            backend:
              service:
                name: {{ $name }}
                port:
                  number: {{ $svc.port }}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.root }}
                port:
                  number: {{ (index .Values.services .Values.ingress.root).port }}
{{- end }}
