{{/*
One Deployment + Service per entry in .Values.services.

Written as a loop rather than seven pairs of near-identical files: what differs between these
services is a port, a replica count and whether they need a database and a broker, and a loop says
that where seven files would bury it.

The Spring configuration inside each image points at localhost, because that is where these
services find their dependencies when you run them from an IDE. Nothing is patched here: Spring's
relaxed binding means SPRING_DATASOURCE_URL and SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS win over
whatever the packaged application.yaml says.
*/}}
{{- $root := . -}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "demo.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $root.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ $root.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        {{- if $svc.db }}
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ $root.Values.engine.postgresHost }} {{ $root.Values.engine.postgresPort }}; do echo waiting for postgres; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        {{- end }}
        {{- if $svc.kafka }}
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z {{ (splitList ":" $root.Values.engine.kafkaBrokers) | first }} {{ (splitList ":" $root.Values.engine.kafkaBrokers) | last }}; do echo waiting for kafka; sleep 2; done']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
        {{- end }}
      containers:
        - name: {{ $name }}
          image: "{{ $root.Values.image.registry }}/{{ $name }}:{{ default $root.Chart.AppVersion $root.Values.image.tag }}"
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          env:
            - name: SERVER_PORT
              value: {{ $svc.port | quote }}
            {{- if $svc.routes }}
            # The gateway is a router, and every destination in its image points at localhost —
            # which inside a pod is the gateway itself, so every route answers "connection
            # refused" until it is told the real addresses. These are the cluster's.
            {{- range $var, $url := $svc.routes }}
            - name: {{ $var }}
              value: {{ $url | quote }}
            {{- end }}
            {{- end }}
            {{- if $svc.db }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://{{ $root.Values.engine.postgresHost }}:{{ $root.Values.engine.postgresPort }}/{{ $root.Values.engine.database }}
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.engine.postgresSecret }}
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $root.Values.engine.postgresSecret }}
                  key: POSTGRES_PASSWORD
            # These services share the engine's database, so their pools come out of the same
            # max_connections. They are demonstrations handling one request at a time, not the
            # engine: Hikari's default of ten each would take a third of the server's connections
            # to sit idle, and the engine is already the largest consumer of them.
            - name: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
              value: {{ $root.Values.engine.dbPoolSize | quote }}
            {{- end }}
            {{- if $svc.kafka }}
            - name: SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS
              value: {{ $root.Values.engine.kafkaBrokers | quote }}
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: {{ $root.Values.engine.kafkaBrokers | quote }}
            {{- end }}
            {{- if $svc.anthropicSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.anthropicSecret }}
                  key: ANTHROPIC_API_KEY
            {{- end }}
            {{- range $k, $v := $svc.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # A listening port, not an actuator endpoint: none of the demo services depends on
          # Spring Boot Actuator, so probing /actuator/health/* asks them for something they do
          # not serve — the reply is a 404 the kubelet reads as a failed liveness check, and it
          # restarts a service that started perfectly well, for ever. Give a service healthPath
          # only if it really serves one.
          readinessProbe:
            {{- if $svc.healthPath }}
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
            {{- else }}
            tcpSocket:
              port: {{ $svc.port }}
            {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            {{- if $svc.healthPath }}
            httpGet:
              path: {{ $svc.healthPath }}
              port: {{ $svc.port }}
            {{- else }}
            tcpSocket:
              port: {{ $svc.port }}
            {{- end }}
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 6
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "demo.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ $root.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
